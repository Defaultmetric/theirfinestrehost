l_english:
 ENG_the_policy_of_appeasement:0 "The Policy of Appeasement"
 ENG_the_policy_of_appeasement_desc:0 "Britain has recovered neither from the last war nor from the slump that followed it. Every grievance settled at the conference table is a war that need never be fought."
 ENG_accepting_rhineland_remilitarization:0 "Accept the Rhineland Remilitarisation"
 ENG_accepting_rhineland_remilitarization_desc:0 "[ENG_GetRhinelandDesc]"
 ENG_accepting_rhineland_remilitarization_desc_hist:0 "German troops have marched into their own back garden, and the public will not go to war over the Rhineland. We shall register our disapproval and keep the peace."
 ENG_accepting_rhineland_remilitarization_desc_alt:0 "Berlin makes no secret of its wish to send troops back into the Rhineland, and the public will not go to war over it. Whatever Germany decides, we shall register our disapproval and keep the peace."
 ENG_avoid_a_constitutional_crisis:0 "Avoid a Constitutional Crisis"
 ENG_avoid_a_constitutional_crisis_desc:0 "The King's attachment to Mrs Simpson threatens to set the Crown against its Ministers and the Dominions. Handled quietly and firmly, the matter can be settled without a breach in the constitution."
 ENG_buy_time:0 "Buy Time"
 ENG_buy_time_desc:0 "Britain is not ready to meet the future today, and every month of peace is a month gained. The Treasury's counsel prevails: sound finance first, the rest in good time."
 ENG_coordination_of_defence:0 "Co-ordination of Defence"
 ENG_coordination_of_defence_desc:0 "A Minister for the Co-ordination of Defence will sit above the three services and settle their quarrels over money. The Treasury grumbles, but the services gain a voice in Cabinet."
 ENG_the_coronation:0 "The Coronation"
 ENG_the_coronation_desc:0 "The crisis is behind us, and in May the Crown will be placed upon the King's head in Westminster Abbey. The pageant will remind the country, and the world, that the monarchy stands firm."
 ENG_allow_the_anschluss:0 "Allow the Anschluss"
 ENG_allow_the_anschluss_desc:0 "[ENG_GetAnschlussDesc]"
 ENG_allow_the_anschluss_desc_hist:0 "Austria has been swallowed by her larger neighbour, and no British interest is served by a protest that cannot be backed with force. We shall look to our own affairs while the peace lasts."
 ENG_allow_the_anschluss_desc_alt:0 "Vienna is under heavy pressure from Berlin, and no British interest is served by a protest that cannot be backed with force. We shall look to our own affairs while the peace lasts."
 ENG_peace_for_our_time:0 "Peace for Our Time"
 ENG_peace_for_our_time_desc:0 "[ENG_GetMunichDesc]"
 ENG_peace_for_our_time_desc_hist:0 "The Sudetenland has changed hands without a shot fired, and the Prime Minister has come home with Herr Hitler's signature. Czechoslovakia pays the price, but Britain gains a year of quiet."
 ENG_peace_for_our_time_desc_alt:0 "Germany has not pressed its claims on Czechoslovakia, and Central Europe is quiet for now. We shall take the peace where it is offered and spend it on the home front."
 ENG_the_gathering_storm:0 "The Gathering Storm"
 ENG_the_gathering_storm_desc:0 "[ENG_GetGatheringStormDesc]"
 ENG_the_gathering_storm_desc_hist:0 "The Sudetenland has been given away, and it has bought only a short breathing space. Mr Churchill has been right about the danger, and the country is beginning to listen."
 ENG_the_gathering_storm_desc_refused:0 "The demand for the Sudetenland has been refused, and Germany will not be satisfied by talk. Every day brings war closer, and the country must prepare."
 ENG_the_gathering_storm_desc_alt:0 "Whatever is settled over Czechoslovakia will buy only a short breathing space. Mr Churchill has been right about the danger, and the country is beginning to listen."
 ENG_end_the_policy_of_appeasement:0 "End the Policy of Appeasement"
 ENG_end_the_policy_of_appeasement_desc:0 "[ENG_GetEndAppeasementDesc]"
 ENG_end_the_policy_of_appeasement_desc_hist:0 "German troops are in Prague, and no one can pretend any longer that Germany can be satisfied. The appeasers have had their hearing; now Britain will prepare for war in earnest."
 ENG_end_the_policy_of_appeasement_desc_alt:0 "The hopes of the conference table are spent, and the country no longer believes that Germany can be satisfied. Britain will stand by her friends and prepare for war in earnest."
 ENG_anglo_french_staff_talks:0 "Anglo-French Staff Talks"
 ENG_anglo_french_staff_talks_desc:0 "For twenty years London has refused to tie its hands to Paris. The General Staffs will now agree where a British Expeditionary Force would land and how the two fleets would share the seas."
 ENG_issue_gasmasks:0 "Air Raid Precautions"
 ENG_issue_gasmasks_desc:0 "Gas masks for every man, woman and child, wardens in every street, sandbags and blackout curtains. Seeing the preparations will steady the nation's nerve."
 ENG_guarantee_poland:0 "Guarantee Poland"
 ENG_guarantee_poland_desc:0 "Germany's next victim is plain for all to see, and His Majesty's Government will stand by Poland should her independence be threatened. It is a line drawn in the sand."

 ENG_politics_buying_time:0 "Buying Time"
 ENG_politics_buying_time_desc:0 "The Treasury has won the argument for now, and the country is in no mood for talk of war."
 ENG_politics_defence_coordination:0 "Co-ordination of Defence"
 ENG_politics_defence_coordination_desc:0 "A Minister now speaks for the three services in Cabinet."
 ENG_politics_peace_for_our_time:0 "Peace for Our Time"
 ENG_politics_peace_for_our_time_desc:0 "The country has breathed a great sigh of relief, and few are in the mood to hear talk of war."
 ENG_politics_gathering_storm:0 "The Gathering Storm"
 ENG_politics_gathering_storm_desc:0 "The nation's eyes are open, and the call for national service is heard across the country."

 ENG_edward_halifax:0 "Lord Halifax"

 ENG_politics_rhineland_gate_tt:0 "Germany has remilitarised the §YRhineland§!"
 ENG_politics_anschluss_gate_tt:0 "Austria has lost §YVienna§! (Austria annexed)"
 ENG_politics_sudeten_crisis_tt:0 "The §YSudeten crisis§! has come: Germany has demanded the Sudetenland or moved against Czechoslovakia, the demand has been answered, or Czechoslovakia no longer holds the Sudetenland"
 ENG_politics_munich_handover_tt:0 "The §YSudetenland§! was handed over to Germany peacefully, or it is after §Y1 November 1938§! and Germany never demanded it"
 ENG_politics_munich_not_refused_tt:0 "The Sudeten demand was §Ynot refused§! (by France, Czechoslovakia or the Allies) and we are §Ynot§! at war with Germany"
 ENG_politics_prague_gate_tt:0 "Czechoslovakia has been dismembered: §YPrague§! is no longer in Czechoslovak hands"
 ENG_politics_end_threat_tt:0 "World tension is above §Y50%§! and we did not choose §YPeace for Our Time§!, or above §Y80%§! and we did"
 ENG_politics_end_date_storm_tt:0 "It is after §Y1 April 1939§! and we did not choose §YPeace for Our Time§!"
 ENG_politics_end_date_peace_tt:0 "It is after §Y1 August 1939§! and we chose §YPeace for Our Time§!"
 ENG_politics_peace_delays_end_tt:0 "§YEnd the Policy of Appeasement§!: not before §Y1 August 1939§! unless Prague falls, world tension passes §Y80%§! or we are at war with a major power."
 ENG_politics_storm_hastens_end_tt:0 "§YEnd the Policy of Appeasement§!: from §Y1 April 1939§!, or earlier if Prague falls, world tension passes §Y50%§! or we are at war with a major power."
 ENG_politics_appeasers_dismissed_tt:0 "§YLord Halifax§! and §YPhilip Kerr§! can no longer be appointed as political advisors."
 ENG_politics_france_available_tt:0 "§YFrance§! exists, is not aligned with Germany and is not at war with us"
 ENG_politics_poland_available_tt:0 "§YPoland§! exists, is independent, is not aligned with Germany and is not at war with us"
