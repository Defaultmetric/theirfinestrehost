l_english:
 tfr_air_support_basic:0 "Basic Aircraft Support Equipment"
 tfr_air_support_basic_desc:0 "Automatically unlocks basic aircraft anti-tank weapons, radio navigation and bomb sights when their airframe requirements are met."
 tfr_air_support_improved:0 "Improved Aircraft Support Equipment"
 tfr_air_support_improved_desc:0 "Automatically unlocks improved aircraft anti-tank weapons, rocket rails, radio navigation and bomb sights when their airframe requirements are met."
 tfr_air_radar_improved:0 "Improved Aircraft Radar Equipment"
 tfr_air_radar_improved_desc:0 "Automatically unlocks the first generation of air-to-air and air-to-ground radar after completing the airborne radar special project and researching an improved airframe or later."
 tfr_air_radar_advanced:0 "Advanced Aircraft Radar Equipment"
 tfr_air_radar_advanced_desc:0 "Automatically unlocks the second generation of air-to-air and air-to-ground radar after completing the airborne radar special project and researching an advanced airframe or later."
 tfr_torpedo_cruiser_1938:0 "Improved Torpedo Cruiser"
 tfr_torpedo_cruiser_1938_desc:0 "Unlocks the 1938 torpedo cruiser after completing the special project and researching the improved cruiser hull."
 tfr_torpedo_cruiser_1942:0 "Advanced Torpedo Cruiser"
 tfr_torpedo_cruiser_1942_desc:0 "Unlocks the 1942 torpedo cruiser after completing the special project and researching the advanced cruiser hull."
