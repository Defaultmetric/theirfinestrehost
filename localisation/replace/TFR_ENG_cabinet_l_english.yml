l_english:
 ### Part cabinet (v2): War Cabinet

 ENG_the_war_cabinet:0 "The War Cabinet"
 ENG_the_war_cabinet_desc:0 "A small War Cabinet of men of proven drive will direct the war effort, each the master of his own field."
 ENG_ernest_bevin_focus:0 "Appoint Ernest Bevin"
 ENG_ernest_bevin_focus_desc:0 "The general secretary of the Transport and General Workers' Union knows the factory floor better than any man in Whitehall. At the Ministry of Labour he will find the hands the war needs."
 ENG_stafford_cripps_focus:0 "Appoint Stafford Cripps"
 ENG_stafford_cripps_focus_desc:0 "Austere and impatient with waste, Sir Stafford Cripps believes the war will be won by planning. Lord Beaverbrook will not serve alongside him."
 ENG_maxwell_aitken_focus:0 "Appoint Lord Beaverbrook"
 ENG_maxwell_aitken_focus_desc:0 "Lord Beaverbrook will run aircraft production as he runs his newspapers: on energy and bluster. Sir Stafford Cripps and his planners would never survive his methods."
 ENG_stewart_menzies_focus:0 "Appoint Stewart Menzies"
 ENG_stewart_menzies_focus_desc:0 "'C' answers to the Prime Minister alone. A seat at the Cabinet table brings him men and money, but the codebreakers and the saboteurs must compete for them."
 ENG_brendan_bracken_focus:0 "Appoint Brendan Bracken"
 ENG_brendan_bracken_focus_desc:0 "The Prime Minister's red-haired confidant understands the press, the wireless and the public mood. As Minister of Information he will keep the country steady."
 ENG_anthony_eden_focus:0 "Appoint Anthony Eden"
 ENG_anthony_eden_focus_desc:0 "Anthony Eden is respected in every Dominion capital and is the natural choice for the Foreign Office. Under him the Empire's partners will be courted, not commanded."
 ENG_edward_bridges_focus:0 "Appoint Edward Bridges"
 ENG_edward_bridges_focus_desc:0 "Sir Edward Bridges is no politician but the quiet engine of the Cabinet Office. With him at the heart of government, the machinery of state turns faster."
 ENG_ministry_of_labour_and_national_service:0 "Ministry of Labour and National Service"
 ENG_ministry_of_labour_and_national_service_desc:0 "Bevin gives the Ministry sweeping powers over who works where. Building gangs and skilled men go wherever the war needs them most."
 ENG_the_bevin_boys_programme:0 "The Bevin Boys Programme"
 ENG_the_bevin_boys_programme_desc:0 "The pits are short of men. One conscript in ten will be sent down the mines instead of into uniform."
 ENG_fuel_the_laboratories:0 "Fuel the Laboratories"
 ENG_fuel_the_laboratories_desc:0 "Bevin releases scientists and technicians from the call-up and sends them to the laboratories. A single good idea may be worth a division."
 ENG_economic_planning_board:0 "The Economic Planning Board"
 ENG_economic_planning_board_desc:0 "Cripps gathers economists, industrialists and union men around one table. For the first time the nation's production is measured and planned."
 ENG_planned_production_targets:0 "Planned Production Targets"
 ENG_planned_production_targets_desc:0 "Every factory receives a target and a schedule, and switching lines is planned months ahead."
 ENG_coordinated_war_economy:0 "A Co-ordinated War Economy"
 ENG_coordinated_war_economy_desc:0 "All of British industry now pulls in one direction. Under Cripps it is planned to the last ration book; under Beaverbrook new shadow plants are scattered beyond the reach of any single raid."
 ENG_form_the_ministry_of_aircraft_production:0 "Form the Ministry of Aircraft Production"
 ENG_form_the_ministry_of_aircraft_production_desc:0 "Beaverbrook takes aircraft production away from the Air Ministry. The great aircraft firms are told what to build, how many and by when."
 ENG_the_beaverbrook_method:0 "The Beaverbrook Method"
 ENG_the_beaverbrook_method_desc:0 "Bully, cajole, telephone at midnight and promise anything: that is the Beaverbrook method, and it works."
 ENG_expand_mi6:0 "Expand MI6"
 ENG_expand_mi6_desc:0 "The Secret Intelligence Service grows into an organisation fit for a world war. New stations open across neutral Europe."
 ENG_special_operations_executive:0 "The Special Operations Executive"
 ENG_special_operations_executive_desc:0 "A new secret army is raised to wage war behind the enemy's lines, its agents dropped by night into occupied Europe."
 ENG_government_code_and_cypher_school:0 "Government Code and Cypher School"
 ENG_government_code_and_cypher_school_desc:0 "At Bletchley Park mathematicians, linguists and chess champions attack the enemy's ciphers."
 ENG_set_europe_ablaze:0 "Set Europe Ablaze"
 ENG_set_europe_ablaze_desc:0 "Railways, power stations and factories in occupied Europe become targets. Raiders and saboteurs keep the enemy's garrisons nervous."
 ENG_absolute_intelligence_dominance:0 "Absolute Intelligence Dominance"
 ENG_absolute_intelligence_dominance_desc:0 "The enemy's signals are read, his agents turned and his rear areas never quiet. Britain fights with its eyes open."
 ENG_the_ministry_of_information:0 "The Ministry of Information"
 ENG_the_ministry_of_information_desc:0 "Bracken turns a ministry the press loves to mock into the voice of the nation."
 ENG_keep_calm_and_carry_on:0 "Keep Calm and Carry On"
 ENG_keep_calm_and_carry_on_desc:0 "The Ministry asks the public for calm, good humour and resolve. A steady home front is the first defence of the realm."
 ENG_master_of_words:0 "Master of Words"
 ENG_master_of_words_desc:0 "Words have become weapons, and the government's word is trusted in every home."
 ENG_the_foreign_office:0 "The Foreign Office"
 ENG_the_foreign_office_desc:0 "Eden restores confidence in British diplomacy. The Dominions are consulted, not lectured."
 ENG_imperial_diplomacy:0 "Imperial Diplomacy"
 ENG_imperial_diplomacy_desc:0 "Conferences, missions and personal letters bind the Commonwealth closer. Britain asks less of its partners in return."
 ENG_clarity_of_purpose:0 "Clarity of Purpose"
 ENG_clarity_of_purpose_desc:0 "Britain's war aims are set out plainly to friend and foe alike. Every ally and every department knows what is expected of it."
 ENG_the_cabinet_secretariat:0 "The Cabinet Secretariat"
 ENG_the_cabinet_secretariat_desc:0 "Bridges builds a secretariat that serves the War Cabinet day and night and carries its decisions into every department."
 ENG_control_the_government_agenda:0 "Control the Government Agenda"
 ENG_control_the_government_agenda_desc:0 "Whoever writes the agenda governs the meeting. The government can steer between the factions of Whitehall at little cost."
 ENG_together_we_stand:0 "Together We Stand"
 ENG_together_we_stand_desc:0 "Party quarrels are set aside for the duration. The ministers of the War Cabinet work as one."
 ENG_the_cabinet_united:0 "The Cabinet United"
 ENG_the_cabinet_united_desc:0 "The War Cabinet has proved its worth, and the Prime Minister brings another trusted man to its table."

