 horsttool.ok:0 "OK"
 horsthelp.1.t:0 "Horst Tool Help"
 horsthelp.1.d:0 "Use the host tool to manage the game, players, boundaries, and balance."
 horsthelp.1.a:0 "Understood"
 horsthelp.2.t:0 "Horst Tool Help"
 horsthelp.2.d:0 "The Horst Tool system is designed to give hosts a more comfortable experience in their games, so they don't waste time on hotjoining players mid-game, and so games don't end prematurely if, say, Germany researches the wrong bonuses, and so on. The Horst Tool has several features: \n\n 1. Changing Borders \nThe horsttool can annex countries, transfer regions, and grant national territory. To annex a country, first select one of its regions, then click 'Mark Region', and click the Annex button. Transferring regions and granting national territory works the same way. \n\n2. Adding Technology Bonuses. \nIf you need to grant a technology bonus to a country, first click on it, then find the table labeled 'Cheats' and choose the bonus you want.\n\n3. Sending Players to Observers. \nTo do this, click on the desired country and then on the large binoculars.\n\n4. Signing Peace. \nTo make peace for a country with everyone, click on the desired country and then on the Armistice button."
 horsthelp.2.a:0 "Thank you, Horst, for your help!"

