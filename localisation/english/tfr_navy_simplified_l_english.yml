 TFR_NAVAL_POSITIONING_INFO:0 "§YFleet size & positioning [?]§!"
 TFR_NAVAL_POSITIONING_INFO_TT:0 "§YFleet size & positioning§!\nNNavy.HIGHER_SHIP_RATIO_POSITIONING_PENALTY_FACTOR = §Y0.5§! (vanilla: §Y0.25§!).\nLarger fleets lose positioning twice as fast as in vanilla, weakening overstacking.\n\nThe penalty compares §Yall ships on each side of the battle§!, including reinforcements. Splitting ships into task forces does not bypass it if they fight together.\nEach +100% ships above the enemy count costs §R50 percentage points§! of positioning, capped at §R75 points§!.\n\n§YFleet size relative to the enemy -> size penalty§!\n1x -> 0 points\n1.5x -> -25 points\n2x -> -50 points\n2.5x or more -> -75 points (cap)\n\n§YPlanning guideline§!\nFor no size penalty: bring no more ships than the enemy.\nFor at least 75% base positioning from fleet size alone: bring at most §Y1.5x the enemy ship count§! (round down).\nExample: enemy 40 ships -> 40 without penalty, or 60 with a 25-point penalty.\n\n§YThere is no fixed optimal maximum ship count.§! The 1.5x guideline limits the size penalty; it is not a guaranteed combat optimum. Composition, screening, aircraft, admirals, weather and other positioning modifiers affect the best fleet size."
