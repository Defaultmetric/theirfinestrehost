  AXIS_romanian_specialization:0 "Romanian Specialization"
  AXIS_romanian_specialization_desc:0 "Focus on the Romanian specialization to enhance your forces' capabilities in specific areas, such as infantry, armor, or artillery, providing unique bonuses that can give you an edge in combat but may limit your flexibility in other areas."

  AXIS_romania_massmob_mobilization:0 "Romanian Mass Mobilization"
  AXIS_romania_massmob_mobilization_desc:0 "Focus on mass mobilization to rapidly expand the Romanian army's size and manpower, allowing for large-scale offensives and defensive operations but at the cost of reduced training and equipment quality."
  AXIS_romania_massmob_pop1:0 "Romanian Mass Recruitment I"
  AXIS_romania_massmob_pop1_desc:0 "Recruit a portion of the Romanian population to rapidly expand the army's size and manpower, allowing for large-scale offensives and defensive operations but at the cost of reduced training and equipment quality."
  AXIS_romania_massmob_pop2:0 "Romanian Mass Recruitment II"
  AXIS_romania_massmob_pop2_desc:0 "Recruit a larger portion of the Romanian population to further expand the army's size and manpower, allowing for even larger-scale offensives and defensive operations but at the cost of further reduced training and equipment quality."
  AXIS_romania_massmob_noncore:0 "Romanian Foreign Recruitment"
  AXIS_romania_massmob_noncore_desc:0 "Recruit from non-core territories to further expand the Romanian army's size and manpower, allowing for even larger-scale offensives and defensive operations but at the cost of further reduced training and equipment quality and potential unrest in occupied territories."
  AXIS_romania_massmob_reinforce:0 "Romanian Improved Comms"
  AXIS_romania_massmob_reinforce_desc:0 "Improve communication and logistics to increase the reinforce rate of Romanian divisions, allowing for faster recovery and replenishment of forces but at the cost of reduced offensive capabilities."
  AXIS_romania_massmob_training:0 "Romanian Training Programs"
  AXIS_romania_massmob_training_desc:0 "Implement training programs to improve the recruitment speed of Romanian divisions, allowing for faster recruitment of new troops but at the cost of reduced training quality and equipment availability."
  AXIS_romania_massmob_recrate:0 "The Romanian Army Spirit"
  AXIS_romania_massmob_recrate_desc:0 "Boost the morale and spirit of the Romanian army to increase the recruitable population, allowing for a larger pool of potential recruits but at the cost of reduced discipline and combat effectiveness."
  AXIS_romania_massmob_entrench:0 "Romanian Defensive Postures" 
  AXIS_romania_massmob_entrench_desc:0 "Focus on defensive postures and fortifications to increase the entrenchment of Romanian divisions, allowing for stronger defensive capabilities but at the cost of reduced offensive capabilities and mobility."
  AXIS_romania_massmob_supply:0 "Romanian Supply Network"
  AXIS_romania_massmob_supply_desc:0 "Improve the supply network and logistics to increase the supply efficiency of Romanian divisions, allowing for better sustainment of forces but at the cost of reduced offensive capabilities and slower movement."
  AXIS_romania_spforces_attack:0 "Romanian Assault Infantry"
  AXIS_romania_spforces_attack_desc:0 "Focus on assault infantry to enhance the offensive capabilities of Romanian divisions, allowing for stronger attacks and breakthroughs but at the cost of reduced defensive capabilities and increased vulnerability to counterattacks."
  AXIS_romania_spforces_defense:0 "Romanian Defensive Infantry"
  AXIS_romania_spforces_defense_desc:0 "Focus on defensive infantry to enhance the defensive capabilities of Romanian divisions, allowing for stronger defenses and resistance to enemy attacks but at the cost of reduced offensive capabilities and slower movement."
  AXIS_romania_spforces_airsup:0 "Romanian Air-Ground Coordination"
  AXIS_romania_spforces_airsup_desc:0 "Improve coordination between Romanian air and ground forces to increase the effectiveness of air support for Romanian divisions, allowing for stronger combined arms operations but at the cost of reduced specialization in either air or ground combat."
  AXIS_romania_spforces_anticas:0 "Romanian Camo Experts"
  AXIS_romania_spforces_anticas_desc:0 "Focus on camouflage and concealment to enhance the survivability of Romanian divisions, allowing for better evasion of enemy detection and attacks but at the cost of reduced offensive capabilities and slower movement."
  AXIS_romania_spforces_cap:0 "Romanian Expand Special Forces"
  AXIS_romania_spforces_cap_desc:0 "Expand the capacity and capabilities of Romanian special forces, allowing for more effective special operations and unconventional warfare but at the cost of reduced conventional combat capabilities and increased resource allocation to elite units."
  AXIS_romania_spforces_arty_attack:0 "Romanian Artillery Offense"
  AXIS_romania_spforces_arty_attack_desc:0 "Focus on artillery offense to enhance the firepower and offensive capabilities of Romanian divisions, allowing for stronger attacks and breakthroughs but at the cost of reduced defensive capabilities and increased vulnerability to counterattacks."
  AXIS_romania_spforces_arty_defense:0 "Romanian Artillery Defense"
  AXIS_romania_spforces_arty_defense_desc:0 "Focus on artillery defense to enhance the survivability and defensive capabilities of Romanian divisions, allowing for stronger defenses and resistance to enemy attacks but at the cost of reduced offensive capabilities and slower movement."
  AXIS_romania_spforces_recrate:0 "Romanian Elite Forces"
  AXIS_romania_spforces_recrate_desc:0 "Boost the morale and spirit of Romanian special forces to increase the recruitable population for elite units, allowing for a larger pool of potential recruits for special forces but at the cost of reduced supply efficiency."
  AXIS_romania_spforces_supply:0 "Romanian Supply Network"
  AXIS_romania_spforces_supply_desc:0 "Improve the supply network and logistics to increase the supply efficiency of Romanian divisions, allowing for better sustainment of forces but at the cost of reduced offensive capabilities and slower movement."
  AXIS_romania_tank_cost:0 "Efficient Manufacturing Process"
  AXIS_romania_tank_cost_desc:0 "Implement more efficient manufacturing processes to reduce the production cost of Romanian tanks, allowing for more tanks to be produced with the same resources."
  AXIS_romania_tank_cost2:0 "Factory Optimized Tank Production"
  AXIS_romania_tank_cost2_desc:0 "Further optimize manufacturing processes and supply chains to further reduce the production cost of Romanian tanks, allowing for even more tanks to be produced with the same resources."
  AXIS_romania_tank_stats1:0 "Improved Tank Designs"
  AXIS_romania_tank_stats1_desc:0 "Implement design improvements to Romanian tanks to increase their combat effectiveness, allowing for stronger tanks."
  AXIS_romania_tank_stats2:0 "Reliable Engines"
  AXIS_romania_tank_stats2_desc:0 "Upgrade the engines of Romanian tanks to improve their reliability and performance, allowing for more effective armored units."
  AXIS_romania_tank_mio:0 "Strict Design Requirements"
  AXIS_romania_tank_mio_desc:0 "Implement strict design requirements and quality control measures for Romanian tanks to improve their durability and combat effectiveness, allowing for more reliable armored units."
  AXIS_romania_tank_mech_att:0 "Mechanized Offensives"
  AXIS_romania_tank_mech_att_desc:0 "Focus on mechanized offensives to enhance the offensive capabilities of Romanian armored units, allowing for stronger attacks and breakthroughs but at the cost of reduced defensive capabilities and increased vulnerability to counterattacks."
  AXIS_romania_tank_mech_def:0 "Mechanized Defenses"
  AXIS_romania_tank_mech_def_desc:0 "Focus on mechanized defenses to enhance the survivability and defensive capabilities of Romanian armored units, allowing for stronger defenses and resistance to enemy attacks but at the cost of reduced offensive capabilities and slower movement."
  AXIS_romania_tank_research:0 "Advanced Prototypes"
  AXIS_romania_tank_research_desc:0 "Invest in research and development to create advanced prototypes of Romanian tanks, allowing for the potential introduction of more powerful and effective armored units but at the cost of increased resource allocation to research and development."
  AXIS_romania_tank_def:0 "The Mogmaxxers"
  AXIS_romania_tank_def_desc:0 "Mogmaxx your enemies on the battlefield with superior defenses and armor."
  AXIS_romania_navy_docks:0 "Naval Dockyard Expansion"
  AXIS_romania_navy_docks_desc:0 "Expand and modernize Romanian naval dockyards to increase ship production capacity and support for naval operations, allowing for a stronger navy."
  AXIS_romania_navy_output:0 "Naval Production Boost"
  AXIS_romania_navy_output_desc:0 "Implement measures to boost naval production in Romania, such as streamlining production processes and increasing workforce efficiency, allowing for more ships to be produced."
  AXIS_romania_navy_sub:0 "Undersea Warfare"
  AXIS_romania_navy_sub_desc:0 "Develop and deploy submarine forces to conduct operations beneath the waves, providing a strategic advantage in naval combat."
  AXIS_romania_navy_dd:0 "Anti-Submarine Warfare"
  AXIS_romania_navy_dd_desc:0 "Develop and deploy destroyer forces to counter enemy submarine threats, providing a strategic advantage in naval combat."
  AXIS_romania_navy_repair:0 "Welding Specialists"
  AXIS_romania_navy_repair_desc:0 "Deploy skilled welding specialists to maintain and repair naval vessels, ensuring their operational readiness and extending their service life."
  AXIS_romania_navy_capitals:0 "Steel Behehemoths"
  AXIS_romania_navy_capitals_desc:0 "Develop and deploy massive capital ships to dominate the seas with overwhelming firepower and armor."
  AXIS_romania_navy_lights:0 "Quantity beats Quality"
  AXIS_romania_navy_lights_desc:0 "Focus on producing a large number of smaller naval vessels to overwhelm the enemy in numbers."
  AXIS_romania_navy_marines:0 "Elite Marine Training"
  AXIS_romania_navy_marines_desc:0 "Invest in specialized training for marine units to enhance their combat effectiveness and tactical capabilities."
  AXIS_romania_air_mio1:0 "Utilize Industrial Giants"
  AXIS_romania_air_mio1_desc:0 "Leverage the industrial capabilities of Romania to boost aircraft production and modernization."
  AXIS_romania_air_cost:0 "Efficient Manufacturing Process"
  AXIS_romania_air_cost_desc:0 "Implement more efficient manufacturing processes to reduce the production cost of Romanian aircraft, allowing for more planes to be produced with the same resources."
  AXIS_romania_air_stats:0 "Technical Superiority"
  AXIS_romania_air_stats_desc:0 "Improve the technical specifications and performance of Romanian aircraft, providing a strategic advantage in aerial combat."
  AXIS_romania_air_lvl:0 "Innovative Designs"
  AXIS_romania_air_lvl_desc:0 "Develop cutting-edge aircraft designs that push the boundaries of aerial technology and performance."
  AXIS_romania_air_radar:0 "Advanced Radars"
  AXIS_romania_air_radar_desc:0 "Equip Romanian aircraft with advanced radar systems to enhance their detection and targeting capabilities, providing a strategic advantage in aerial combat."
  AXIS_romania_air_jets:0 "Develop Jet Propulsion"
  AXIS_romania_air_jets_desc:0 "Invest in the development of jet engine technology for Romanian aircraft, providing a significant performance advantage in aerial combat."
  AXIS_romania_air_gsp:0 "Ground Support Specialist"
  AXIS_romania_air_gsp_desc:0 "Train Romanian pilots and ground crews in specialized ground support tactics and techniques to enhance the effectiveness of air-ground coordination and support for ground forces."
  AXIS_romania_air_ac:0 "Air Controller Specialization"
  AXIS_romania_air_ac_desc:0 "Specialize in air control and management to optimize the deployment and coordination of aircraft in combat scenarios."
  AXIS_romania_unknown_specialization:0 "Unknown Specialization"
  AXIS_romania_unknown_specialization_desc:0 "Choose a specialization for Romanian forces to enhance their capabilities in a specific area, such as infantry, armor, artillery, or air power. Each specialization provides unique bonuses and advantages but may limit flexibility in other areas. Choose wisely to maximize the effectiveness of your forces on the battlefield."
  ROM_mio_trait_technical_superiority:0 "Technical Superiority"
  ROM_mio_trait_cheap_parts:0 "Cheaper Parts"
  ROM_mio_trait_naval_targeting:0 "Naval Targeting"

