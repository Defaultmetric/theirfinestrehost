  AXIS_germany_spforces_cap_desc:0 "Expand the capacity and capabilities of German special forces, allowing for more effective special operations and unconventional warfare but at the cost of reduced conventional combat capabilities and increased resource allocation to elite units."
  AXIS_germany_navy_capitals:0 "Steel Behemoths"
  AXIS_germany_navy_capitals_desc:0 "Invest in the development of large, heavily armored warships to dominate the seas and project power."
  AXIS_germany_navy_lights:0 "Quantity over Quality"
  AXIS_germany_navy_lights_desc:0 "Focus on producing a large number of smaller, more versatile warships to overwhelm the enemy and maintain naval superiority."
