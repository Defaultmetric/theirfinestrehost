 yugoslavia.71.t: "Fate Of Yugoslavia"
 yugoslavia.71.d: "[From.GetNameDefCap] demands that we hand over full control of our country to them. All citizens of Yugoslavia will in essence become German and we will no longer have any influence. We can chose to stand our ground here and hope that help will come, but this may very well be the only way to avoid a slaughter of the Yugoslav people."
 yugoslavia.71.a: "We must stand firm"
 yugoslavia.71.b: "It will spare so many lives"
 yugoslavia.81.d: "[From.GetNameDefCap] demands that we hand over full control of our country. The citizens of Yugoslavia will in essence become citizens of [From.GetNameDef] or one of their puppet states. We can chose to stand our ground here and hope that help will come, but this may very well be the only way to avoid a slaughter of the Yugoslav people."
 yugoslavia.81.a: "We must stand firm"
 yugoslavia.81.b: "It will spare so many lives"
 yugoslavia.91.d: "[From.GetNameDefCap] demands that we cede territory to a newly formed Croatian government, controlled by [From.GetNameDef]. They also demand we implement major government reforms, which will allow us to govern the citizens of Yugoslavia, but with heavy [From.GetAdjective] influence on our politics. We can chose to stand our ground here and hope that help will come, but this may very well be the only way to avoid a slaughter of the Yugoslav people."
 yugoslavia.91.a: "We must stand firm"
 yugoslavia.91.b: "It will spare so many lives"
