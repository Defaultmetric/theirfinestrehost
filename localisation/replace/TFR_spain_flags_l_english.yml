 # Spanish Focus Additions
 SPA_the_skill_issue:0 "End the Fratricidal Deadlock"
 SPA_the_skill_issue_desc:0 "The civil war has dragged on past all reason, exhausting both sides and devastating the countryside. We must take emergency measures to bring this painful deadlock to an immediate close and declare the civil war over."

 # Spanish Decision Descriptions
 expand_basque_steel_works_desc:0 "Expand and modernize the Basque iron foundries and blast furnaces to boost domestic steel output."
 expand_granada_steel_works_desc:0 "Construct additional smelting facilities and rolling mills across Granada to supply our growing industries with quality steel."
 expand_madrid_bauxite_mines_desc:0 "Intensify bauxite mining operations in the Madrid basin to provide the raw materials required for domestic aluminum and aircraft production."
 expand_western_aragon_steel_works_desc:0 "Upgrade the metallurgical infrastructure of Western Aragon to process regional iron ores into refined industrial steel."
 expand_extremadura_tungsten_mines_desc:0 "Deepen shaft extraction and improve processing equipment in Extremadura's rich tungsten deposits, vital for hardened armor and munitions."
 develop_galicia_tungsten_deposits_desc:0 "Survey and excavate untapped tungsten veins across Galicia to feed our armament arsenals and international trade."
 develop_salamanca_tungsten_deposits_desc:0 "Fund systematic geological prospecting and mining works in Salamanca to extract strategic tungsten reserves."
 develop_valladolid_tungsten_deposits_desc:0 "Open new open-cast and underground tungsten extraction sites across Valladolid to maximize strategic ore yields."
 SPR_concessions_to_the_anarchists_desc:0 "Grant political and economic compromises to the CNT-FAI and anarchist communes to preserve revolutionary anti-fascist unity in the defense of the Republic."
 SPR_eliminate_guerrillas_desc:0 "Deploy military garrisons and security sweeps to pacify resistance cells and root out anti-regime irregulars operating in this province."
