 ENG_beaverbrook_mass_production_idea:0 "Beaverbrook's Production Drive"
 ENG_beaverbrook_mass_production_idea_desc:0 "Every aircraft line runs day and night under the Beaver's orders."
 ENG_cabinet_bevin_boys_pits:0 "The Bevin Boys in the Pits"
 ENG_cabinet_bevin_boys_pits_desc:0 "One conscript in ten goes down the mines, and the Bevin Boys concern puts every one of them to work."

