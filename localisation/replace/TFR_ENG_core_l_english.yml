 # TFR UK rework v2 - part core (generated by SCRATCH/build2/core_work/gen_core.py)

 # National spirits (dynamic modifiers)
 ENG_economy_dyn:0 "Recovering from the Depression"
 ENG_economy_dyn_desc:0 "The slump still hangs over the North, and only §YRecovering from the Great Depression§! will lift these penalties.\n\n§gLimits: $MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$ +15%, $modifier_production_speed_industrial_complex_factor$ +15%, $modifier_production_speed_arms_factory_factor$ +15%, $MODIFIER_PRODUCTION_FACTORY_MAX_EFFICIENCY_FACTOR$ +10.5%, $MODIFIER_PRODUCTION_FACTORY_EFFICIENCY_GAIN_FACTOR$ +15%, $MODIFIER_PRODUCTION_FACTORY_START_EFFICIENCY_FACTOR$ +20%, $MODIFIER_LINE_CHANGE_PRODUCTION_EFFICIENCY_FACTOR$ +20%, $MODIFIER_LOCAL_RESOURCES_FACTOR$ +10%.§!"
 ENG_economy_base_dyn:0 "The British Economy"
 ENG_economy_base_dyn_desc:0 "The mills, mines and shipyards of Britain, and the Treasury that pays for them.\n\n§gLimits: $MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$ +15%, $modifier_production_speed_industrial_complex_factor$ +15%, $modifier_production_speed_arms_factory_factor$ +15%, $MODIFIER_PRODUCTION_FACTORY_MAX_EFFICIENCY_FACTOR$ +10.5%, $MODIFIER_PRODUCTION_FACTORY_EFFICIENCY_GAIN_FACTOR$ +15%, $MODIFIER_PRODUCTION_FACTORY_START_EFFICIENCY_FACTOR$ +20%, $MODIFIER_LINE_CHANGE_PRODUCTION_EFFICIENCY_FACTOR$ +20%, $MODIFIER_LOCAL_RESOURCES_FACTOR$ +10%.§!"
 ENG_economy_rearmament_dyn:0 "Rearmament Economy"
 ENG_economy_rearmament_dyn_desc:0 "The money has been voted, and orders for guns, aircraft and ships are reaching the factories at last.\n\n§gLimits: $MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$ +15%, $modifier_production_speed_industrial_complex_factor$ +15%, $modifier_production_speed_arms_factory_factor$ +15%, $MODIFIER_PRODUCTION_FACTORY_MAX_EFFICIENCY_FACTOR$ +10.5%, $MODIFIER_PRODUCTION_FACTORY_EFFICIENCY_GAIN_FACTOR$ +15%, $MODIFIER_PRODUCTION_FACTORY_START_EFFICIENCY_FACTOR$ +20%, $MODIFIER_LINE_CHANGE_PRODUCTION_EFFICIENCY_FACTOR$ +20%, $MODIFIER_LOCAL_RESOURCES_FACTOR$ +10%.§!"
 ENG_economy_arsenal_dyn:0 "Arsenal of Britain"
 ENG_economy_arsenal_dyn_desc:0 "From the Clyde to the Thames the works run day and night to arm the nation and its allies.\n\n§gLimits: $MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$ +15%, $modifier_production_speed_industrial_complex_factor$ +15%, $modifier_production_speed_arms_factory_factor$ +15%, $MODIFIER_PRODUCTION_FACTORY_MAX_EFFICIENCY_FACTOR$ +10.5%, $MODIFIER_PRODUCTION_FACTORY_EFFICIENCY_GAIN_FACTOR$ +15%, $MODIFIER_PRODUCTION_FACTORY_START_EFFICIENCY_FACTOR$ +20%, $MODIFIER_LINE_CHANGE_PRODUCTION_EFFICIENCY_FACTOR$ +20%, $MODIFIER_LOCAL_RESOURCES_FACTOR$ +10%.§!"
 ENG_economy_workshop_dyn:0 "Workshop of the World"
 ENG_economy_workshop_dyn_desc:0 "Every ton of steel and every pound of credit in the Empire is bent to the needs of the Home Islands.\n\n§gLimits: $MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$ +15%, $modifier_production_speed_industrial_complex_factor$ +15%, $modifier_production_speed_arms_factory_factor$ +15%, $MODIFIER_PRODUCTION_FACTORY_MAX_EFFICIENCY_FACTOR$ +10.5%, $MODIFIER_PRODUCTION_FACTORY_EFFICIENCY_GAIN_FACTOR$ +15%, $MODIFIER_PRODUCTION_FACTORY_START_EFFICIENCY_FACTOR$ +20%, $MODIFIER_LINE_CHANGE_PRODUCTION_EFFICIENCY_FACTOR$ +20%, $MODIFIER_LOCAL_RESOURCES_FACTOR$ +10%.§!"
 ENG_army_dyn:0 "Legacy of the Ten Year Rule"
 ENG_army_dyn_desc:0 "A decade of the Ten Year Rule has left the Army's doctrine and staff work behind; §Y$ENG_army_rearmament_focus$§! lifts these penalties.\n\n§gEach value is capped at 10% to 30%, depending on the line.§!"
 ENG_army_base_dyn:0 "The British Army"
 ENG_army_base_dyn_desc:0 "A small, long-service army, built to police an Empire and now asked to prepare for a European war.\n\n§gEach value is capped at 10% to 30%, depending on the line.§!"
 ENG_army_modern_dyn:0 "A Modern Army"
 ENG_army_modern_dyn_desc:0 "The British Army is mechanised, properly trained and led by officers who understand the modern battlefield.\n\n§gEach value is capped at 10% to 30%, depending on the line.§!"
 ENG_air_dyn:0 "The Royal Air Force"
 ENG_air_dyn_desc:0 "The youngest of the services, on whose squadrons the defence of these islands from the air depends.\n\n§gEach value is capped at 10% to 30%, depending on the line.§!"
 ENG_air_finest_hour_dyn:0 "Their Finest Hour"
 ENG_air_finest_hour_dyn_desc:0 "The pilots of Fighter Command and the men and women behind them have made the skies over Britain their own.\n\n§gEach value is capped at 10% to 30%, depending on the line.§!"
 ENG_navy_dyn:0 "The Royal Navy"
 ENG_navy_dyn_desc:0 "For three centuries the Royal Navy has kept the sea lanes of the Empire open, and it is stretched across every ocean.\n\n§gEach value is capped at 10% to 30%, depending on the line.§!"
 ENG_navy_senior_service_dyn:0 "The Senior Service"
 ENG_navy_senior_service_dyn_desc:0 "Refitted, repaired and ready, the fleet will meet whatever the enemy sends to sea.\n\n§gEach value is capped at 10% to 30%, depending on the line.§!"

