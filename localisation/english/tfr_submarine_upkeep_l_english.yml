l_english:
 tfr_submarine_upkeep_1:0 "Submarine Upkeep: §GNone§!"
 tfr_submarine_upkeep_1_desc:0 "Submarine production cost changes with the number of deployed submarines. The upkeep tier is recalculated daily and falls when the fleet shrinks. Germany, Italy, Japan, the United States and the United Kingdom change tiers at 25, 50, 75 and 100 submarines. The Netherlands changes tiers at 9, 17, 25 and 34 after completing Rely on Submarines. All submarine hull types count toward the limit."
