l_english:
 naval_rearmament_focus:0 "Naval Rearmament"
 naval_rearmament_focus_desc:0 "The Ten Year Rule has left the slipways of the Clyde, the Tyne and Belfast half idle. Three yards reopened now will let the Admiralty begin replacing the tired veterans of the last war."
 uk_destroyer_focus:0 "The Destroyer Flotillas"
 uk_destroyer_focus_desc:0 "It is the destroyer that screens the fleet and shepherds the convoys. The Admiralty shall order the flotillas in numbers, on simple designs that any yard in the Kingdom can build."
 uk_waves_focus:0 "Britannia Rules the Waves"
 uk_waves_focus_desc:0 "For three centuries the Royal Navy has kept these islands free. Its doctrine must now keep pace with radar, aircraft and long-range gunnery."
 uk_amphibious_focus:0 "Amphibious Warfare"
 uk_amphibious_focus_desc:0 "Gallipoli taught us, at a terrible price, what a landing on a defended shore demands. The Inter-Service Training and Development Centre shall work out how to put an army ashore."
 uk_convoy_focus:0 "Convoy Escorts"
 uk_convoy_focus_desc:0 "The convoy system won the last war at sea, and the lesson must not be forgotten again. Simple escort vessels and standard merchant hulls, built quickly and cheaply, will keep the ocean lanes open."
 ENG_a_s_warfare:0 "Anti-Submarine Warfare"
 ENG_a_s_warfare_desc:0 "In 1917 the U-boat came within weeks of starving Britain into surrender. ASDIC gives our escorts ears beneath the waves; now their crews must learn to listen, and to hunt."
 uk_battleship_focus:0 "The Battle Fleet"
 uk_battleship_focus_desc:0 "The battleship remains the final arbiter of sea power. The Admiralty shall build a battle line that can outfight anything afloat."
 uk_carrier_focus:0 "Naval Aviation"
 uk_carrier_focus_desc:0 "The aeroplane has changed war at sea for ever. The Admiralty shall build its strength around the aircraft carrier, which strikes from beyond the horizon and beyond the reach of any gun."
 ENG_the_royal_marines:0 "The Royal Marines"
 ENG_the_royal_marines_desc:0 "Per Mare, Per Terram. The Corps shall be trained and equipped for the assault from the sea, ready to seize a beach, a port or an island for the army that follows."
 ENG_western_approaches_command:0 "Western Approaches Command"
 ENG_western_approaches_command_desc:0 "The fate of the war will be decided on the Atlantic convoy routes. A single command at Liverpool shall direct every escort group from the Clyde to the mid-ocean meeting point."
 ENG_whale_island_gunnery_school:0 "The Whale Island Gunnery School"
 ENG_whale_island_gunnery_school_desc:0 "HMS Excellent at Whale Island has trained the Navy's gunners since the days of sail. Its instructors shall drill every turret crew in the fleet until the first salvo straddles and the second one hits."
 ENG_the_inskip_award:0 "The Inskip Award"
 ENG_the_inskip_award_desc:0 "Control of the Fleet Air Arm returns from the Air Ministry to the Admiralty. At last our carriers shall have aircrew trained by sailors for war at sea, and aircraft built to the Navy's own requirements."
 ENG_secure_the_imperial_shipping_routes:0 "Secure the Imperial Shipping Routes"
 ENG_secure_the_imperial_shipping_routes_desc:0 "The Empire lives by its sea lanes: the Mediterranean, the Cape, the Indian Ocean and the Pacific. Cruisers on every station shall hunt down the raiders before they find our convoys."
 ENG_anti_submarine_training_school:0 "The Anti-Submarine Training School"
 ENG_anti_submarine_training_school_desc:0 "No escort shall join a convoy group until it has been worked up to a fighting pitch. A hard school at Tobermory and Portland will turn green crews into U-boat killers within weeks."
 ENG_the_line_of_battle:0 "The Line of Battle"
 ENG_the_line_of_battle_desc:0 "The battle fleet stands ready to meet any enemy in a fleet action, with admirals who know how to fight it. Where the battleship goes, command of the sea follows."
 ENG_strike_from_the_sea:0 "Strike from the Sea"
 ENG_strike_from_the_sea_desc:0 "A handful of torpedo bombers launched from an armoured deck can cripple a fleet at anchor in its own harbour. Our carriers shall carry the war to the enemy's battleships wherever they hide."
 ENG_expand_the_repair_yards:0 "The Senior Service"
 ENG_expand_the_repair_yards_desc:0 "A damaged ship returned to sea quickly is worth a new one on the slipway. New dry docks and repair yards will make the Royal Navy the Senior Service in deed as well as in name."
 ENG_naval_rearmament_three_yards_tt:0 "§G+3§! §YNaval Dockyards§! and §G+3§! shared building slots in coastal core states."
 ENG_expand_the_repair_yards_two_yards_tt:0 "§G+2§! §YNaval Dockyards§! and §G+2§! shared building slots in coastal core states."
