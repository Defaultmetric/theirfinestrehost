 AXIS_blitzkrieg_economy:0 "Blitzkrieg Economy"
 AXIS_blitzkrieg_economy_desc:0 "Adopt a faction-wide, high-pressure economic model that frontloads production at the cost of long-term stability."

 AXIS_blitzkrieg_phase1:0 "Blitzkrieg Phase I"
 AXIS_blitzkrieg_phase1_desc:0 "Accelerate output before the war through aggressive financing and requisitioning. Provides short-term strength but shortens the window before collapse."

 AXIS_blitzkrieg_phase1_rubber:0 "Emergency Rubber Fabrication"
 AXIS_blitzkrieg_phase1_rubber_desc:0 "Expand rubber production through synthetic programs and emergency measures. Boosts rubber supply but further reduces the time before collapse."

 AXIS_blitzkrieg_phase2:0 "Blitzkrieg Phase II"
 AXIS_blitzkrieg_phase2_desc:0 "Mobilize the economy fully for wartime needs. Production surges, but the collapse draws nearer."

 AXIS_blitzkrieg_phase3:0 "Financial Collapse"
 AXIS_blitzkrieg_phase3_desc:0 "The economic strain reaches its breaking point. The Blitzkrieg Economy collapses, leaving lasting instability."

