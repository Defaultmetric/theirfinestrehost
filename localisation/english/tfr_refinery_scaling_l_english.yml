 tfr_refinery_scaling_1:0 "Synthetic Refinery Coordination (Tier 1)"
 tfr_refinery_scaling_1_desc:0 "The applicable country group controls 0-6 synthetic refineries. This changes synthetic refinery construction speed by +80%. Refineries in controlled states are counted across the group, including eligible countries outside the faction. The group total and this effect are updated daily. The Allied group receives no modifier at 12 or fewer refineries."
