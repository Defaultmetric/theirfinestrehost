 Shared_AXIS_the_waiting_game:0 "The Waiting Game"
 Shared_AXIS_the_waiting_game_desc:0 "A deliberate long-war economy: slow start, rationing and stockpiles. Few early benefits, but if we endure for several years the accumulated preparations trigger an overwhelming late-war boost."

 AXIS_the_waiting_game:0 "The Waiting Game"
 AXIS_the_waiting_game_desc:0 "Commit to a long-war posture: rationing, stockpiles, repairs, and fortifications. Early output stays modest, but the payoff comes later once the machine is fully mobilized."

 AXIS_the_waiting_game_phase1:0 "Waiting Game Phase I"
 AXIS_the_waiting_game_phase1_desc:0 "Lay the groundwork: audits, simplified lines, spare-parts pools, and trained repair crews. Slower today for fewer breakdowns tomorrow."

 AXIS_the_waiting_game_phase1_emergency:0 "Waiting Game: Emergency Measures"
 AXIS_the_waiting_game_phase1_emergency_desc:0 "A temporary stopgap to stabilize output while Phase I ramps up."

 AXIS_the_waiting_game_phase2:0 "Waiting Game Phase II"
 AXIS_the_waiting_game_phase2_desc:0 "Expand depots and construction corps, diversify inputs, and tighten logistics. The system begins to scale."

 AXIS_the_waiting_game_phase3:0 "An Economy Unbound"
 AXIS_the_waiting_game_phase3_desc:0 "Years of preparation culminate in a late-war surge: higher caps, faster builds, leaner consumer demand, and improved synthetic output."

 axis_waiting_game_timer:0 "The Waiting Game: "
 axis_waiting_game_timer_desc:0 "A long-war buildup on a fixed timer. Integrate key regions to shorten the countdown. When time runs out, the accumulated preparations unlock their full potential."

 waiting_game_timer:0 "The Waiting Game: "
 waiting_game_timer_desc:0 "A long-war buildup on a fixed timer. Integrate key regions to shorten the countdown. When time runs out, the accumulated preparations unlock their full potential."

 axis_integrate_france:0 "Integrate France"
 axis_integrate_france_desc:0 "Consolidate control and fold the French economy into ours. Shortens the Waiting Game countdown."

 axis_integrate_africa:0 "Integrate North Africa"
 axis_integrate_africa_desc:0 "Secure the North African coastline and logistics hubs, bringing them into our economic system. Shortens the Waiting Game countdown."

 axis_integrate_saf:0 "Integrate South Africa"
 axis_integrate_saf_desc:0 "Absorb South African industry and ports into our network. Shortens the Waiting Game countdown."

 axis_integrate_uk:0 "Integrate the United Kingdom"
 axis_integrate_uk_desc:0 "Bring the British Isles under full administrative and economic control. Shortens the Waiting Game countdown."

 axis_integrate_gib:0 "Integrate Gibraltar"
 axis_integrate_gib_desc:0 "Control the gateway of the Mediterranean and align its administration with ours. Shortens the Waiting Game countdown."

 axis_integrate_kiev:0 "Integrate Kiev"
 axis_integrate_kiev_desc:0 "Establish permanent administration and link local industry to our supply corridors. Shortens the Waiting Game countdown."

 axis_integrate_moscow:0 "Integrate Moscow"
 axis_integrate_moscow_desc:0 "Bring the central hub of administration and infrastructure into our system. Shortens the Waiting Game countdown."

 axis_integrate_leningrad:0 "Integrate Leningrad"
 axis_integrate_leningrad_desc:0 "Absorb the northern industrial center and its ports into our economy. Shortens the Waiting Game countdown."

 axis_integrate_stalingrad:0 "Integrate Stalingrad"
 axis_integrate_stalingrad_desc:0 "Secure and refit the Volga industrial axis under our management. Shortens the Waiting Game countdown."

 axis_integrate_india:0 "Integrate India"
 axis_integrate_india_desc:0 "Bind the subcontinent’s resources and industry to our logistics network. Shortens the Waiting Game countdown."

 axis_integrate_norway:0 "Integrate Norway"
 axis_integrate_norway_desc:0 "Bring Norwegian ports and industry into our economic system. Shortens the Waiting Game countdown."


