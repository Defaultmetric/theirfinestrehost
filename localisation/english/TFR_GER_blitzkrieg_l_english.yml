 TFR_GER_blitzkrieg:0 "Blitzkrieg!"
 TFR_GER_blitzkrieg_desc:0 "Concentrated armored spearheads, mobile infantry and air superiority will drive our opening offensive. Coordinated logistics will sustain the advance and help our forces break through enemy lines. This temporary surge lasts for 120 days after our response to Poland's refusal to cede Danzig."
