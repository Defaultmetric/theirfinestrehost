l_english:
 ENG_army_rearmament_focus:0 "Rearm the Army"
 ENG_army_rearmament_focus_desc:0 "For a decade the Army was told there would be no great war, and it shrank to a colonial police force. The Ten Year Rule is dead, and the War Office may at last ask for money, men and modern equipment."
 ENG_the_commandos:0 "The Commandos"
 ENG_the_commandos_desc:0 "Small parties of picked volunteers, landed from the sea, will strike at a coast the enemy believes is safe. Raiding keeps him guessing along every mile of his shore."
 ENG_the_hore_belisha_reforms:0 "The Hore-Belisha Reforms"
 ENG_the_hore_belisha_reforms_desc:0 "The new Secretary of State for War has swept away a generation of elderly generals and modernised the soldier's lot. Now the War Office must decide what kind of war it means to fight."
 ENG_motorized_focus:0 "A Motorised Army"
 ENG_motorized_focus_desc:0 "Britain can build lorries faster than any nation in Europe can breed horses. Every infantry division is to move on wheels."
 uk_small_arms_focus:0 "The Birmingham Small Arms Company"
 uk_small_arms_focus_desc:0 "BSA at Small Heath and the Royal Small Arms Factory at Enfield will turn out rifles and Bren guns in quantities not seen since 1918. New lines are to be laid down at once."
 ENG_special_air_service:0 "The Special Air Service"
 ENG_special_air_service_desc:0 "A young Scots Guards officer proposes to drop small teams far behind the enemy's lines to destroy aircraft on the ground. The idea is irregular, unorthodox and worth trying."
 ENG_imperial_policing:0 "Imperial Policing"
 ENG_imperial_policing_desc:0 "Twenty years of keeping the peace from the North-West Frontier to Palestine have made the light infantry battalion the Army's real strength. Let us build on what we already do well."
 ENG_the_set_piece_battle:0 "The Set-Piece Battle"
 ENG_the_set_piece_battle_desc:0 "We will not squander another generation in hurried attacks. The guns will be massed, and the infantry sent forward only when the artillery has done its work."
 ENG_the_mobile_division:0 "The Mobile Division"
 ENG_the_mobile_division_desc:0 "The Experimental Mechanised Force showed on Salisbury Plain what tanks can do when freed from the infantry's pace. A Mobile Division of tanks, carriers and motor battalions will strike deep and fast."
 ENG_tank_focus:0 "The Royal Tank Corps"
 ENG_tank_focus_desc:0 "Britain invented the tank and then forgot it. New infantry tanks and light cruisers must be designed and ordered now, before the Germans finish what we began at Cambrai."
 ENG_long_range_desert_group:0 "The Long Range Desert Group"
 ENG_long_range_desert_group_desc:0 "Men who have mapped the Great Sand Sea in Model T Fords offer to patrol a thousand miles behind the enemy's front. They will make the open desert our road and the enemy's prison."
 ENG_colossal_cracks:0 "Colossal Cracks"
 ENG_colossal_cracks_desc:0 "Every offensive is to be a colossal crack of overwhelming fire, careful rehearsal and a master plan. Heavy infantry tanks will walk beside the riflemen."
 ENG_the_armoured_division:0 "The Armoured Division"
 ENG_the_armoured_division_desc:0 "The Mobile Division becomes a true armoured division, built around fast cruiser tanks and motorised support. Its armoured cars will find the enemy's flank and lead the tanks through it."
 ENG_royal_artillery:0 "The Royal Regiment of Artillery"
 ENG_royal_artillery_desc:0 "The guns have always been the backbone of the British Army. The 25-pounder, the 2-pounder and the Bofors will give the Royal Artillery the finest field equipment in the world."
 ENG_a_modern_army:0 "A Modern Army"
 ENG_a_modern_army_desc:0 "Doctrine, equipment and men now fit together. The colonial constabulary of 1936 is ready to meet a continental enemy on equal terms."
 ENG_parachute_regiments:0 "The Parachute Regiment"
 ENG_parachute_regiments_desc:0 "The Prime Minister wants a corps of five thousand parachute troops. Ringway will train them, and they will spearhead every great landing to come."
