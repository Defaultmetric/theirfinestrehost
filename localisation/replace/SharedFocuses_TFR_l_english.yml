  AXIS_continue_the_air_research_desc:0 "Invest in continued research and development for air power to maintain and enhance the technological edge of your air forces, allowing for the introduction of new and improved aircraft and technologies over time."
  AXIS_naval_expertise:0 "Naval Expertise"
  AXIS_naval_expertise_desc:0 "Focus on developing naval expertise and capabilities to enhance the effectiveness of your navy, allowing for better naval operations, strategy, and tactics to gain an advantage at sea."
  AXIS_continue_the_navy_research:0 "Continue the Navy Research"
  AXIS_continue_the_navy_research_desc:0 "Invest in continued research and development for naval power to maintain and enhance the technological edge of your navy, allowing for the introduction of new and improved ships and technologies over time."
  AXIS_tank_design_improvements:0 "Tank Design Improvements"
  AXIS_tank_design_improvements_desc:0 "Invest in research and development to create design improvements for tanks, allowing for more effective armored units and combat capabilities on the battlefield."
  AXIS_land_warfare_facility_two:0 "Land Warfare Facility II"
