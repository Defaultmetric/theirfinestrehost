l_english:
 uk_empire_focus:0 "Reinforce the Empire"
 uk_empire_focus_desc:0 "The Empire spans a quarter of the globe, held together by sea lanes, coaling stations and the goodwill of the Dominions. Before we decide what it is to be in the coming war, we must make sure it can be held at all."
 uk_mediterranean_focus:0 "Mediterranean Bastion"
 uk_mediterranean_focus_desc:0 "Alexandria is the anchorage of the Mediterranean Fleet and the shield of the Suez Canal. Its harbour defences, airfields and docks must be ready before the Italians test them."
 uk_asia_focus:0 "Fortify Malaya"
 uk_asia_focus_desc:0 "Singapore is the bastion of our position in the East and Malaya the hinterland that feeds it. The great naval base must be finished and its airfields extended before the Japanese test our resolve."
 uk_protect_suez_desc:0 "The Canal is the jugular vein of the Empire. Fortified approaches, more airfields and anti-aircraft guns will keep it open whatever the Italians do in Libya."
 uk_malta_focus_desc:0 "Malta lies within sight of the Sicilian airfields. Only guns, shelters and fighter strips will let the island survive as an unsinkable base in the middle of the Italian sea."
 uk_rock_focus_desc:0 "Gibraltar holds the western gate of the Mediterranean. Tunnels in the Rock, heavier batteries and a proper airstrip will make it impregnable from land, sea and air."
 singapore_focus:0 "The Singapore Strategy"
 singapore_focus_desc:0 "The main fleet will sail east when the danger comes, and Singapore must hold until it arrives. Heavy guns face the sea, and this time the landward approaches will not be forgotten either."
 peninsular_focus:0 "Defend the Peninsula"
 peninsular_focus_desc:0 "An enemy who lands in the north of Malaya can walk down the peninsula to the back door of Singapore. Pillboxes on the roads of Kelantan, Perak and Kedah and a forward airfield will make him pay for every mile."
 ENG_commonwealth_partnership:0 "A Commonwealth Partnership"
 ENG_commonwealth_partnership_desc:0 "The Dominions are partners in a common cause, no longer children of the Mother Country. If British capital builds up their industries now, the whole Commonwealth will stand stronger when the storm breaks, even if our own factories feel the strain."
 ENG_britain_alone:0 "Britain Alone"
 ENG_britain_alone_desc:0 "The Empire exists to sustain the Home Islands, and in the hour of danger it shall do exactly that. Every idle lathe from Ottawa to Cape Town will be bent to the needs of London."
 ENG_britain_alone_colour_tt:0 "The United Kingdom is shown in §Rbright red§! on the map (name and flag unchanged)."
 ENG_britain_alone_requisitions_tt:0 "Our subjects in the faction among §YCanada§!, §YAustralia§!, §YSouth Africa§! and §Ythe Raj§! (where in play) get §RImperial Requisitions§!: factory output §R-10%§!, construction speed §R-15%§!, consumer goods §R+10%§!."
 ENG_british_commonwealth_air_training_plan_desc:0 "The skies of the Prairies are wide, safe and out of reach of the Luftwaffe. Flying schools across Canada, staffed and paid for together, will turn the young men of the whole Commonwealth into pilots, navigators and gunners by the tens of thousands."
 ENG_bcatp_req_tt:0 "At least one Commonwealth investment partner is in our faction and has not capitulated"
 ENG_the_sterling_area:0 "The Sterling Area"
 ENG_the_sterling_area_desc:0 "Since we left gold in 1931 the Dominions have kept their reserves in London and their accounts in sterling. Formalising the bloc keeps the City at the heart of imperial finance and spares the British consumer part of the price of our obligations overseas."
 ENG_sterling_softens_tt:0 "§YImperial Obligations§!: consumer goods per active step §R+2.5%§! → §R+2%§!."
 ENG_inv_steps_2_tt:0 "At least §Y2§! active investment steps (now: §Y[?ENG_total_investment|0]§!)"
 ENG_imperial_preference:0 "Imperial Preference"
 ENG_imperial_preference_desc:0 "The Ottawa agreements gave Empire goods a favoured place in British markets. Extending them to the machinery and raw materials our partners need lets British builders work on imperial contracts without starving the Home Islands of construction."
 ENG_preference_softens_tt:0 "§YImperial Obligations§!: civilian construction speed per active step §R-1.2%§! → §R-0.9%§!."
 ENG_inv_steps_3_tt:0 "At least §Y3§! active investment steps (now: §Y[?ENG_total_investment|0]§!)"
 ENG_the_imperial_conference:0 "The Imperial Conference"
 ENG_the_imperial_conference_desc:0 "The Prime Ministers of the Commonwealth gather in London to coordinate their research, their trade and their plans for war. There is no talk of federation: the partnership stands on the consent of free nations."
 ENG_conference_partners_tt:0 "§YBrazil§!, if a partner, joins §YCommonwealth Research§!."
 ENG_inv_steps_5_tt:0 "At least §Y5§! active investment steps (now: §Y[?ENG_total_investment|0]§!)"
 ENG_commonwealth_of_nations_focus:0 "Commonwealth of Nations"
 ENG_commonwealth_of_nations_focus_desc:0 "The investment of the last years has borne fruit: the Dominions build ships, aircraft and shells in their own right. The dividends flow back to London in orders, licences and a few factories of our own."
 ENG_inv_steps_6_tt:0 "At least §Y6§! active investment steps (now: §Y[?ENG_total_investment|0]§!)"
 ENG_commonwealth_returns_tt:0 "Return while invested: §G+1§! offsite civilian factory at §Y15§! surviving invested factories, §G+1§! more at §Y25§!, §G+1§! offsite military factory at §Y35§!; each is taken back below its threshold (now §Y[?ENG_total_inv_buildings|0]§!)."
 ENG_fortress_britain:0 "Fortress Britain"
 ENG_fortress_britain_desc:0 "Whatever becomes of the Empire, these islands must not fall. The Channel ports will be ringed with guns, and the ordnance factories of the Midlands will be built first and fastest."
 ENG_the_colonies_will_fight:0 "The Colonies Will Fight"
 ENG_the_colonies_will_fight_desc:0 "From the Gold Coast to the Punjab the colonies have always sent their sons to fight for the King. An organised recruitment drive across the Empire will fill the ranks without emptying the factories at home."
 ENG_workshop_of_the_world:0 "Workshop of the World"
 ENG_workshop_of_the_world_desc:0 "Britain was the first industrial nation and, fed by the whole Empire, it shall be the greatest once more. Requisitioned materials and modernised works will make our factories the envy of every power on earth."
 ENG_workshop_req_tt:0 "At least §Y3§! active requisitions (now: §Y[?ENG_req_active|0]§!)"
 ENG_workshop_lapse_tt:0 "The factory output is §Rlost for good§! if fewer than §Y3§! requisitions stay active."
 uk_canada_focus:0 "The Canadian Shipyards"
 uk_canada_focus_desc:0 "Halifax, Sorel and the yards of the St. Lawrence built ships for the last war and stood idle after it. British orders and British credit will reopen their slipways for the corvettes and freighters the Atlantic will need."
 ENG_arvida_aluminium:0 "The Arvida Smelter"
 ENG_arvida_aluminium_desc:0 "Cheap power from the Saguenay makes Arvida the natural home of aluminium for the whole Empire. An expanded smelter and the works to roll its metal will give Canada a foundation for an aircraft industry of its own."
 ENG_victory_aircraft:0 "Victory Aircraft"
 ENG_victory_aircraft_desc:0 "A great aircraft works at Malton, outside Toronto, will build heavy bombers under licence from British designs. Canada will no longer only train the crews of Bomber Command: it will build their machines as well."
 ENG_canadian_car_and_foundry:0 "Canadian Car and Foundry"
 ENG_canadian_car_and_foundry_desc:0 "The railway workshops of Fort William can turn out Hurricanes as readily as freight cars. Tooled with British jigs, they will supply fighters to the training schools and the front alike."
 uk_australia_focus:0 "Broken Hill Proprietary"
 uk_australia_focus_desc:0 "The steelworks at Newcastle are among the cheapest in the world. British capital for new furnaces and rolling mills will make Australia the arsenal of the Pacific and free it from waiting on ships from home."
 ENG_australian_munitions:0 "The Munitions Supply Board"
 ENG_australian_munitions_desc:0 "Lithgow, Maribyrnong and Footscray already make rifles, cordite and shells. With British tools and patterns the Munitions Supply Board can equip the Australian divisions entirely from local production."
 ENG_commonwealth_aircraft_corporation:0 "Commonwealth Aircraft Corporation"
 ENG_commonwealth_aircraft_corporation_desc:0 "At Fishermans Bend the Commonwealth Aircraft Corporation is building its first trainers. British licences and engineers will let it build combat aircraft for the defence of the continent."
 ENG_australian_dockyards:0 "Cockatoo Island Dockyard"
 ENG_australian_dockyards_desc:0 "Sydney's great dockyard can build destroyers and refit cruisers if it is given the cranes, the dry dock and the skilled men. It will become the base of a Pacific fleet that does not depend on Singapore."
 uk_south_africa_focus:0 "The Iron and Steel Corporation"
 uk_south_africa_focus_desc:0 "The state steelworks at Pretoria are young but growing. With British investment ISCOR can supply the mines, the railways and, in time, the munitions works of the Union."
 ENG_the_rand_mines:0 "The Rand Mines"
 ENG_the_rand_mines_desc:0 "The gold, coal and chrome of the Witwatersrand pay for the Union and feed the Empire's foundries. New shafts and new plant will make the mining industry the backbone of a southern war economy."
 ENG_cape_ports:0 "Simon's Town and Durban"
 ENG_cape_ports_desc:0 "Every convoy that cannot use the Mediterranean must round the Cape. Shipyards at Simon's Town and Durban will repair and build the escorts that keep that route open."
 uk_india_focus:0 "The Indian Ordnance Factories"
 uk_india_focus_desc:0 "Ishapore, Kanpur and Jabalpur make the rifles and shells of the Indian Army in numbers far below what a world war will need. New lines and British machine tools will turn them into true arsenals."
 ENG_tata_steel:0 "Tata Iron and Steel"
 ENG_tata_steel_desc:0 "At Jamshedpur the Tata works already make the cheapest steel in the Empire. Expanded with British support, they can supply armour plate and gun steel for India and for the whole Eastern theatre."
 ENG_eastern_group_supply_council:0 "The Eastern Group Supply Council"
 ENG_eastern_group_supply_council_desc:0 "India, Australia, South Africa and the colonies of the East will pool their production under a single council in Delhi, so that the armies east of Suez are supplied from the East rather than from Britain."
 ENG_hindustan_aircraft:0 "Hindustan Aircraft"
 ENG_hindustan_aircraft_desc:0 "Walchand Hirachand's aircraft company at Bangalore wants to build aeroplanes in India. British licences and engineers will give the Raj an aircraft industry of its own."
 ENG_indian_dockyards:0 "Bombay and Calcutta Dockyards"
 ENG_indian_dockyards_desc:0 "The great harbours of Bombay and Calcutta can build and repair the escorts of the Indian Ocean if their dockyards are modernised. The Royal Indian Navy will grow from its own yards."
 ENG_brazilian_partnership:0 "Volta Redonda"
 ENG_brazilian_partnership_desc:0 "Brazil dreams of a national steel industry and has the ore to feed one. British financing for the great steelworks at Volta Redonda will bind Rio de Janeiro to the Allied cause in iron."
 ENG_brazilian_rubber:0 "The Rubber Agreements"
 ENG_brazilian_rubber_desc:0 "The forests of the Amazon still hold the rubber the Empire will need if the plantations of the East are ever lost. Contracts, credit and new processing works will bring it to market."
 ENG_fabrica_nacional_de_motores:0 "Fabrica Nacional de Motores"
 ENG_fabrica_nacional_de_motores_desc:0 "A national engine factory near Rio will build aero-engines and lorries under licence. Brazil will be able to power its own aircraft and its own army."
 ENG_galeao_aircraft_factory:0 "The Galeao Aircraft Factory"
 ENG_galeao_aircraft_factory_desc:0 "On the island of Governador the Brazilian government is building an aircraft factory. British designs and engineers will put trainers and fighters on its production lines."
 ENG_brazilian_naval_arsenal:0 "The Ilha das Cobras Arsenal"
 ENG_brazilian_naval_arsenal_desc:0 "The naval arsenal of Rio de Janeiro can build destroyers if it is given the means. A modern yard will give the South Atlantic a second home for Allied escorts."
 ENG_requisition_canadian_industry:0 "Requisition Canadian Industry"
 ENG_requisition_canadian_industry_desc:0 "Canadian factories will work to orders placed in London, and the machine tools ordered for Canada's own expansion will cross the Atlantic eastwards instead."
 ENG_the_canadian_munitions_pool:0 "The Canadian Munitions Pool"
 ENG_the_canadian_munitions_pool_desc:0 "Shells, fuses and small arms from Canadian plants go into a single pool controlled by the Ministry of Supply, and the Home Army draws on it first."
 ENG_requisition_australian_industry:0 "Requisition Australian Industry"
 ENG_requisition_australian_industry_desc:0 "Australia's ordnance works will fill British contracts before Australian ones. Canberra protests that the Pacific is left bare; London answers that the war will be decided in Europe."
 ENG_australian_steel_for_britain:0 "Australian Steel for Britain"
 ENG_australian_steel_for_britain_desc:0 "The output of Newcastle and Port Kembla is shipped to British mills, leaving the Australian munitions programme to make do with what is left."
 ENG_requisition_the_rand:0 "Requisition the Rand"
 ENG_requisition_the_rand_desc:0 "The mines and workshops of the Witwatersrand are placed under British contracts. The Union's own industrial plans must wait."
 ENG_requisition_indian_ordnance:0 "Requisition Indian Ordnance"
 ENG_requisition_indian_ordnance_desc:0 "The ordnance factories of India will deliver to the War Office in London first. The Indian Army will be equipped from whatever remains."
