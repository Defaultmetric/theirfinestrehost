l_english:
 ENG_recovering_from_the_great_depression:0 "Recovering from the Great Depression"
 ENG_recovering_from_the_great_depression_desc:0 "The worst of the slump is behind us, but the old industries of the North still work short time. Cheap money and a little help from Whitehall will put the mills, mines and shipyards back to work."
 ENG_invest_in_the_construction_sector:0 "Invest in the Construction Sector"
 ENG_invest_in_the_construction_sector_desc:0 "Cheap money has set off a building boom in the suburbs. If we back houses, roads and factory estates, the country will build itself up: slowly, but with no bill to pay later."
 ENG_utilize_american_aid:0 "Utilise American Credit"
 ENG_utilize_american_aid_desc:0 "American banks and machine-tool makers are eager for British orders. Their credit puts new factories to work at once, but the account falls due in two years."
 ENG_special_areas_act:0 "The Special Areas Act"
 ENG_special_areas_act_desc:0 "Tyneside, Clydeside and South Wales have known nothing but the dole for a decade. The Commissioners for the Special Areas can fund roads, trading estates and new works there."
 ENG_aero_engine_shadow_factories:0 "Aero-Engine Shadow Factories"
 ENG_aero_engine_shadow_factories_desc:0 "Lord Nuffield, the Rootes brothers and the other motor manufacturers will build and run new works for the Air Ministry. They will turn out engines and airframes when they are needed."
 ENG_billingham_works:0 "The Billingham Works"
 ENG_billingham_works_desc:0 "Imperial Chemical Industries' plant at Billingham already makes petrol out of Durham coal. Government support for hydrogenation will give us a home-grown source of fuel."
 ENG_prepare_for_the_inevitable:0 "Prepare for the Inevitable"
 ENG_prepare_for_the_inevitable_desc:0 "Whatever the Cabinet says in public, the armament firms must assume that war will come. New capacity is to be laid down now."
 ENG_steady_production:0 "Steady Production"
 ENG_steady_production_desc:0 "Long production runs on proven designs, built by men who know their machines. The lines will take time to reach full stride, but they will end up the best in the world."
 ENG_rapid_output:0 "Output Above All"
 ENG_rapid_output_desc:0 "Every factory is to work double shifts from today. What the services need now is quantity."
 ENG_computing_machines:0 "Computing Machines"
 ENG_computing_machines_desc:0 "The calculating engines of our universities and the radio laboratories of Marconi and the Post Office can do far more than tabulate census returns. Given men and money, they can take on the hardest problems of the war."
 ENG_the_arsenal_of_britain:0 "The Arsenal of Britain"
 ENG_the_arsenal_of_britain_desc:0 "From the Clyde to the Medway, British industry now works for victory. The depressed areas of ten years ago have become the arsenal of the free world."
 ENG_shadow_scheme_war_tt:0 "At the first war with a §Ymajor power§!: §G+2§! §YMilitary Factories§! and §G+2§! building slots in each of two home states with room (once)."
 ENG_construction_sector_matures_tt:0 "Later, each step a year apart: §G+1§! §YCivilian Factory§! (from §Y1 June 1938§!), §G+1§! (from §Y1 January 1941§!), §G+2§! (from §Y1 January 1942§!), each with a building slot."
 ENG_construction_sector_one_civ_tt:0 "§G+1§! §YCivilian Factory§! and §G+1§! building slot in a home state (offsite if none has room)."
 ENG_economy_two_civ_home_tt:0 "§G+2§! §YCivilian Factories§! and §G+2§! building slots in home states (offsite if none has room)."
 ENG_economy_two_mil_home_tt:0 "§G+2§! §YMilitary Factories§! and §G+2§! building slots in home states (offsite if none has room)."
 ENG_american_aid_debt_tt:0 "In §Y730§! days, for §Y300§! days:"
 ENG_special_areas_unlock_tt:0 "Unlocks §Y3§! §YSpecial Areas§! decisions: §G+1§! infrastructure and §G+1§! building slot each in [131.GetName], [133.GetName] and [122.GetName]."
 ENG_shadow_factories_unlock_tt:0 "Unlocks §Y2§! §YShadow Factory§! decisions (from §Y1937§!, one at a time): §G+1§! §YMilitary Factory§! and §G+1§! building slot each."
 ENG_the_bevin_boys_upgrade_tt:0 "Upgraded through the §YBevin Boys Programme§! decisions."
 ENG_american_debt:0 "The American Account"
 ENG_american_debt_desc:0 "Every dollar we send to New York to repay the credits of 1936 is a dollar not spent at home."
 ENG_imperial_chemical_industries:0 "Imperial Chemical Industries"
 ENG_marconi_company:0 "Marconi Company"
 ENG_nuffield_organisation:0 "Nuffield Organisation"
 ENG_economic_recovery_category:0 "Economic Recovery"
 ENG_economic_recovery_category_desc:0 "The Special Areas Commissioners and the Treasury manage the recovery of the depressed regions and our debts abroad."
 ENG_shadow_factories_category:0 "The Shadow Factories"
 ENG_shadow_factories_category_desc:0 "The Air Ministry pays the motor industry to build new works that will turn to war production when the time comes."
 ENG_special_area_tyneside:0 "Special Area: Tyneside and Durham"
 ENG_special_area_tyneside_desc:0 "The Team Valley trading estate and new roads will bring light industry to the shipyard towns of the North-East."
 ENG_special_area_clydeside:0 "Special Area: Clydeside"
 ENG_special_area_clydeside_desc:0 "The Hillington estate outside Glasgow will give the Clyde work besides the next naval order."
 ENG_special_area_south_wales:0 "Special Area: South Wales"
 ENG_special_area_south_wales_desc:0 "The Treforest estate and better roads into the valleys will draw new firms into the coalfield."
 ENG_settle_the_american_account:0 "Settle the American Account"
 ENG_settle_the_american_account_desc:0 "We can pay off what remains of the American credits in one go, at the price of tying up our own industry."
 ENG_shadow_factory_castle_bromwich:0 "Shadow Factory: Castle Bromwich"
 ENG_shadow_factory_castle_bromwich_desc:0 "Lord Nuffield will build a great aircraft works at Castle Bromwich, outside Birmingham."
 ENG_shadow_factory_speke:0 "Shadow Factory: Speke"
 ENG_shadow_factory_speke_desc:0 "The Rootes Group will build and run a bomber assembly plant at Speke, beside Liverpool's airport."
 tfr_eng_economy.2.t:0 "The Construction Sector Matures"
 tfr_eng_economy.2.d:0 "The building firms we backed have grown into a sizeable industry, and new factory estates are opening on the edge of our towns."
 tfr_eng_economy.2.a:0 "Bricks and mortar win wars too."
 tfr_eng_economy.3.t:0 "The American Account Falls Due"
 tfr_eng_economy.3.d:0 "The first instalments on the American credits are due, and for the next year a share of our output must go to pay for them."
 tfr_eng_economy.3.a:0 "A gentleman pays his debts."
