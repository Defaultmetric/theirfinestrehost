  AXIS_specialized_forces:0 "Specialized Forces"
  AXIS_specialized_forces_desc:0 "Focus on developing specialized forces with unique skills and capabilities to enhance the effectiveness of your military, allowing for more effective operations in specific areas such as infantry, armor, artillery, or air power."
  AXIS_better_radios:0 "Better Radios"
  AXIS_better_radios_desc:0 "Invest in the development and production of better radios to improve communication and coordination among your forces, allowing for more effective command and control during combat operations."
  AXIS_support_eq_bonus:0 "Support Equipment Research"
  AXIS_support_eq_bonus_desc:0 "Focus on researching and developing improved support equipment to enhance the effectiveness of your military units and operations."
