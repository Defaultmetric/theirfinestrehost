 sp_land_super_heavy_at: "Super-Heavy Anti-Tank"
 sp_land_super_heavy_at_desc: "A formidable high-velocity anti-tank gun boasting a massive caliber, capable of piercing the thickest enemy armor from extreme ranges."
 sp_land_self_propelled_super_heavy_at: "Self-Propelled Super-Heavy Anti-Tank"
 sp_land_self_propelled_super_heavy_at_desc: "A self-propelled massive anti-tank gun with greater maneuverability on the battlefield than its towed counterpart, while accommodating an even heavier armor-piercing cannon."
 sp_land_reward_super_heavy_at_focus_preference: "Design Focus"
 sp_land_reward_super_heavy_at_focus_preference_desc: "As development progresses, a critical decision must be made: We can prioritize fast production and lighter-caliber guns, or we can invest in bigger and heavier high-velocity guns, sacrificing production efficiency for unparalleled armor penetration and hard attack."
 sp_land_reward_option_super_heavy_at_focus_preference_balance: "Keep Balance"
 sp_land_reward_option_super_heavy_at_focus_preference_firepower: "Focus on Firepower"
 sp_land_reward_option_super_heavy_at_focus_preference_production: "Focus on Fast Production"
 sp_land_reward_self_propelled_super_heavy_at_focus_preference: "$sp_land_reward_super_heavy_at_focus_preference$"
 sp_land_reward_self_propelled_super_heavy_at_focus_preference_desc: "$sp_land_reward_super_heavy_at_focus_preference_desc$"
 sp_land_reward_option_self_propelled_super_heavy_at_focus_preference_balance: "$sp_land_reward_option_super_heavy_at_focus_preference_balance$"
 sp_land_reward_option_self_propelled_super_heavy_at_focus_preference_firepower: "$sp_land_reward_option_super_heavy_at_focus_preference_firepower$"
 sp_land_reward_option_self_propelled_super_heavy_at_focus_preference_production: "$sp_land_reward_option_super_heavy_at_focus_preference_production$"
 super_heavy_at_upgrade_1: "Tungsten-Core Heavy Piercing Shells"
 super_heavy_at_upgrade_1_desc: "Heavy sub-caliber projectiles with dense tungsten-carbide cores designed specifically for large-caliber anti-tank guns, substantially increasing armor penetration and hard attack."
 super_heavy_at_upgrade_2: "High-Pressure Breech & Recoil Systems"
 super_heavy_at_upgrade_2_desc: "Reinforced breech blocks and hydropneumatic recuperators allow our super-heavy anti-tank guns to fire higher-velocity propellant charges safely and accurately."
 super_heavy_at2: "Advanced Super-Heavy Anti-Tank"
 super_heavy_at2_desc: "$super_heavy_at_equipment_2_desc$"

