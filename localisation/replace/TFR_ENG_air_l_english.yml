l_english:
 limited_rearmament_focus:0 "Limited Rearmament"
 limited_rearmament_focus_desc:0 "The White Paper on Defence has broken the long silence on the nation's weakness. A modest programme of new works in the industrial districts is the first step."
 general_rearmament_focus:0 "General Rearmament"
 general_rearmament_focus_desc:0 "Germany rearms in the open and Italy has shown what the League is worth. The country must accept austerity at home so that the factories may work for the Services."
 air_rearmament_focus:0 "Air Rearmament"
 air_rearmament_focus_desc:0 "The Expansion Schemes promise the Royal Air Force new squadrons, new aircraft and new stations. The Air Ministry must turn promises on paper into airfields, aircrew and machines."
 aircraft_production_focus:0 "Aircraft Production"
 aircraft_production_focus_desc:0 "The aircraft industry is a cottage industry of gifted designers and small works. It must learn to build in hundreds, and the firms that have proved themselves deserve the contracts to do it."
 ENG_vickers_experimental_facility_focus:0 "Vickers Experimental Facilities"
 ENG_vickers_experimental_facility_focus_desc:0 "At Foxwarren and Weybridge, Vickers keeps engineers whose work runs ahead of any Air Ministry specification. Giving them the means to build and test their ideas will serve the Air Force and the Army alike."
 uk_jet_focus:0 "The Jet Engine"
 uk_jet_focus_desc:0 "Frank Whittle patented his jet engine before most of the world had heard of the idea. With the Gloster E.28/39 ready to fly, the time has come to back Power Jets with real money and real priority."
 fighter_command_focus:0 "Fighter Command"
 fighter_command_focus_desc:0 "The bomber will not always get through. Modern monoplane fighters and the system that guides them will defend these islands."
 bomber_command_focus:0 "Bomber Command"
 bomber_command_focus_desc:0 "The Trenchard doctrine holds that the best defence is the power to strike at the enemy's industry. A strong bomber force will carry the war to Germany when nothing else can."
 coastal_command_focus:0 "Coastal Command"
 coastal_command_focus_desc:0 "The Cinderella service flies old aircraft over the sea lanes on which the nation's food and fuel arrive. It deserves aircraft that can find a periscope and strike a raider."
 ENG_the_dowding_system:0 "The Dowding System"
 ENG_the_dowding_system_desc:0 "Air Chief Marshal Dowding has joined radar, the Observer Corps and the sector stations into one chain of command. Every raid can now be plotted and met at the right height and place."
 ENG_air_chain_home_unlock_tt:0 "Unlocks the §YChain Home§! decisions: §G+1§! §YRadar Station§! in each of §Y4§! east-coast states."
 ENG_forward_interception:0 "Forward Interception"
 ENG_forward_interception_desc:0 "Air Vice-Marshal Keith Park would meet each raid early with whatever squadrons are ready, and break it up before it reaches the target. Hawker's rugged Hurricanes are the backbone of such a fight."
 ENG_the_big_wing:0 "The Big Wing"
 ENG_the_big_wing_desc:0 "Air Vice-Marshal Leigh-Mallory and Squadron Leader Bader want several squadrons to fight together as one wing. Massed Spitfire wings will crush a raid, and later carry the fight across the Channel."
 ENG_the_few:0 "The Few"
 ENG_the_few_desc:0 "Never in the field of human conflict was so much owed by so many to so few. The pilots of Fighter Command have become the nation's champions, and the best of them its legends."
 ENG_the_strategic_air_offensive:0 "The Strategic Air Offensive"
 ENG_the_strategic_air_offensive_desc:0 "Bomber Command will strike at the oil, the railways and the factories that feed the German war machine. The Air Staff must learn how to find a target in the dark, and how to hit it."
 ENG_the_heavy_bomber_programme:0 "The Heavy Bomber Programme"
 ENG_the_heavy_bomber_programme_desc:0 "Specification B.12/36 calls for four-engined bombers of a size the Royal Air Force has never flown. Avro, Handley Page and Short Brothers must build them, and Lincolnshire must find the airfields."
 ENG_the_pathfinder_force:0 "The Pathfinder Force"
 ENG_the_pathfinder_force_desc:0 "Most bombs fall miles from their aiming point. An elite force of the best navigators, flying ahead with radio aids and target markers, will show the rest of Bomber Command where to drop them."
 ENG_thousand_bomber_raids:0 "Thousand-Bomber Raids"
 ENG_thousand_bomber_raids_desc:0 "Air Marshal Harris means to show what Bomber Command can do when it is concentrated: a thousand aircraft over one city in a single night, overwhelming its defences by sheer weight."
 ENG_maritime_patrol_squadrons:0 "Maritime Patrol Squadrons"
 ENG_maritime_patrol_squadrons_desc:0 "Long-range flying boats and patrol aircraft can close the gaps that the escorts cannot cover. Coastal Command needs the aircraft and the weapons to sink what it finds."
 ENG_their_finest_hour:0 "Their Finest Hour"
 ENG_their_finest_hour_desc:0 "The Royal Air Force has come of age. Whatever the war asks of it, in the skies over these islands, over Germany or over the sea lanes, it has the men, the machines and the doctrine to answer."
 ENG_air_chain_home_category:0 "Chain Home"
 ENG_air_chain_home_category_desc:0 "The radar chain must be carried north to the Tyne, the Forth and Scapa Flow, at the cost of factories spared for some weeks."
 ENG_air_chain_home_yorkshire:0 "Chain Home: Yorkshire"
 ENG_air_chain_home_yorkshire_desc:0 "A station on the Yorkshire coast will watch the approaches to Hull and the industrial West Riding."
 ENG_air_chain_home_northern_england:0 "Chain Home: Northern England"
 ENG_air_chain_home_northern_england_desc:0 "A station on the Northumbrian coast will cover the Tyne and its shipyards."
 ENG_air_chain_home_scottish_lowlands:0 "Chain Home: Scottish Lowlands"
 ENG_air_chain_home_scottish_lowlands_desc:0 "A station near the Firth of Forth will guard Rosyth and Edinburgh."
 ENG_air_chain_home_aberdeenshire:0 "Chain Home: Aberdeenshire"
 ENG_air_chain_home_aberdeenshire_desc:0 "A station on the north-east coast of Scotland will give warning of raids on Aberdeen and the fleet anchorage beyond."
