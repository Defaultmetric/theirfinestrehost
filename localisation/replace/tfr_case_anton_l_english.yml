l_english:
 GER_case_anton_tt:0 "Immediately transfers only the listed states still controlled by Vichy France. States controlled by any other country are left unchanged.\n\n§YGermany§! receives mainland states 851, 21, 32, 20, 26, 33, 25 and 31.\n§YItaly§! receives Savoy (735) and Corsica (1).\nNorth African states 665, 458, 513, 460, 459, 461 and 462 go to §YItaly§! if Italy controls state 448 when this decision is taken; otherwise they go to §YFree France (FRA)§! if it exists, or to the §YUnited Kingdom (ENG)§! if FRA does not exist. Free France is not required to take this decision. Each state must still be controlled by Vichy to be transferred.\n\nThe French fleet is seized after 7 days. §RVichy can scuttle it after 2 days unless German troops are in Toulon!§!"
 FRA_case_anton_mission_tt:0 "The German seizure of the remaining Vichy fleet is avoided. Territorial transfers already made by Case Anton are not reversed."
 TFR_case_anton_mission_timeout_tt:0 "Germany seizes the remaining Vichy fleet. No additional states are annexed."
 wtt_news.23.t:0 "Germany Seizes the Vichy Fleet"
 wtt_news.23.desc:0 "Following Case Anton, Vichy-controlled territories designated by the operation have been reassigned. The remaining Vichy fleet has now fallen into German hands, with no further territorial transfers."
 wtt_news.24.desc:0 "Following Case Anton and the reassignment of the designated Vichy-controlled territories, the Vichy authorities ordered their fleet scuttled to prevent its seizure by Germany. No further territories have changed hands."
