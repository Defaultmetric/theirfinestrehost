 TFR_SPA_recovery_programme_tt:0 "National Recovery in §YSpanish Economy§! becomes:"
 TFR_SPA_volunteer_spain:0 "Arsenal of the Axis"
 TFR_SPA_volunteer_spain_desc:0 "Spain cannot afford the ruinous devastation of another direct war so soon after the civil conflict. Instead, by serving as the industrial and logistical arsenal for our Axis allies and deploying specialized volunteer forces, we can rebuild our economy while securing prestige and vital trade in the new European order."
 TFR_SPA_war_spain:0 "Our Place in the New Order"
 TFR_SPA_war_spain_desc:0 "The tide of history is turning, and neutrality will only leave Spain isolated and weak. To claim our rightful position as a dominant Mediterranean and Atlantic power, we must throw our full weight behind the Axis cause and stand shoulder to shoulder with the new masters of Europe."
 TFR_SPA_axis_liaison_office:0 "Axis Liaison Office"
 TFR_SPA_axis_liaison_office_desc:0 "Establishing permanent diplomatic and military coordination offices with Berlin and Rome ensures our strategic interests are represented and military cooperation proceeds smoothly without sacrificing sovereign control."
 TFR_SPA_join_the_axis:0 "Join the Axis"
 TFR_SPA_join_the_axis_desc:0 "Formalizing our entry into the Axis alliance cements our military partnership with Germany and Italy, opening the path for mutual defense, technological exchange, and coordinated military operations across the Mediterranean."
 TFR_SPA_iberian_economic_agreement:0 "Iberian Economic Agreement"
 TFR_SPA_iberian_economic_agreement_desc:0 "Securing economic hegemony across the Iberian peninsula begins with favorable commercial accords with Lisbon, integrating Portuguese resources, tungsten, and raw materials into our national industrial networks."
 TFR_SPA_portuguese_industrial_relocation:0 "Portuguese Industrial Relocation"
 TFR_SPA_portuguese_industrial_relocation_desc:0 "Through coordinated economic pacts, critical industrial machinery, civilian facilities, and dockyard equipment from mainland Portugal are systematically relocated to protected Spanish production centers, shielding them from Allied maritime blockade."
 TFR_SPA_attack_portugal:0 "Attack Portugal"
 TFR_SPA_attack_portugal_desc:0 "If Lisbon refuses to align with the new continental realities, Spain must take direct action. Unifying the Iberian Peninsula under Madrid's authority by force will permanently eliminate an Allied foothold on our flank."
 TFR_SPA_integrate_portugal:0 "Integrate Portugal"
 TFR_SPA_integrate_portugal_desc:0 "With the Portuguese territories secured, our administrative and economic systems must rapidly absorb Portuguese ports, infrastructure, and factories into a unified Iberian economic and defensive sphere."
 TFR_SPA_national_reconstruction_commission:0 "National Reconstruction Commission"
 TFR_SPA_national_reconstruction_commission_desc:0 "The civil war has left Spain's cities, bridges, and rail lines shattered. A central commission empowered to direct public funds and materials will spearhead the vital work of physical and economic rebuilding."
 TFR_SPA_german_military_mission:0 "German Military Mission"
 TFR_SPA_german_military_mission_desc:0 "Inviting German military advisers to Madrid enables our officer corps to master modern doctrine, armored operations, and tactical command principles forged in continental campaigns."
 TFR_SPA_italian_naval_mission:0 "Italian Naval Mission"
 TFR_SPA_italian_naval_mission_desc:0 "Collaborating closely with the Regia Marina provides our naval architects and admirals with vital expertise in Mediterranean convoy escort, light cruiser operations, and naval aviation coordination."
 TFR_SPA_foreign_aviation_mission:0 "Foreign Aviation Mission"
 TFR_SPA_foreign_aviation_mission_desc:0 "Capitalizing on close ties with foreign aviation experts allows the Spanish Air Force to absorb lessons on high-altitude interception, dive-bombing, and integrated warning systems."
 TFR_SPA_full_war_commitment:0 "Full War Commitment"
 TFR_SPA_full_war_commitment_desc:0 "Every facet of the Spanish state must be mobilized toward the total defeat of our enemies. All civilian production, raw materials, and manpower pools are pledged to victory alongside our continental allies."
 TFR_SPA_continental_war_coordination:0 "Continental War Coordination"
 TFR_SPA_continental_war_coordination_desc:0 "By coordinating operational timetables, railway gauge conversions, and joint logistics with our allies, Spain becomes the indispensable southwestern anchor of continental European strategy."
 TFR_SPA_enduring_industrial_partnership:0 "Enduring Industrial Partnership"
 TFR_SPA_enduring_industrial_partnership_desc:0 "Cementing long-term bilateral industrial agreements ensures that cutting-edge machine tools, technical blueprints, and raw materials will continue to flow into Spanish factories regardless of external pressures."
 TFR_SPA_restore_civil_administration:0 "Restore Civil Administration"
 TFR_SPA_restore_civil_administration_desc:0 "Transitioning authority from military tribunals to competent civil governors stabilizes public order, re-establishes provincial taxation, and ensures that bureaucratic governance functions seamlessly across all provinces."
 TFR_SPA_integrate_the_autonomous_regions:0 "Integrate the Autonomous Regions"
 TFR_SPA_integrate_the_autonomous_regions_desc:0 "Regional separatism and fractured authority can no longer be tolerated. Centralizing administration across Catalonia, the Basque country, and Galicia creates a single, indivisible legal and economic entity."
 TFR_SPA_demobilisation_and_reemployment:0 "Demobilisation and Reemployment"
 TFR_SPA_demobilisation_and_reemployment_desc:0 "Thousands of wartime soldiers must be transitioned into productive civilian life. Structured public works, vocational placement, and agricultural re-settlement will prevent postwar economic collapse and unrest."
 TFR_SPA_national_labour_accords:0 "National Labour Accords"
 TFR_SPA_national_labour_accords_desc:0 "Bringing together state syndicates, factory owners, and workers under a unified corporate framework settles industrial disputes, guarantees minimum living standards, and ensures uninterrupted production."
 TFR_SPA_rebuild_the_universities:0 "Rebuild the Universities"
 TFR_SPA_rebuild_the_universities_desc:0 "Reopening and reforming our historic centers of higher education in Madrid, Salamanca, and Barcelona will cultivate the next generation of engineers, scientists, administrators, and officers essential to modern statecraft."
 TFR_SPA_national_mobilisation_framework:0 "National Mobilisation Framework"
 TFR_SPA_national_mobilisation_framework_desc:0 "Codifying state powers to requisition vital goods, allocate strategic raw materials, and register labor pools ensures that Spain can transition rapidly from peaceful reconstruction to full wartime readiness."
 TFR_SPA_organise_national_service:0 "Organise National Service"
 TFR_SPA_organise_national_service_desc:0 "Instituting mandatory civic and labor service for Spanish youth instills national discipline, supplies labor for massive infrastructure projects, and prepares the populace for military duty if called."
 TFR_SPA_the_postwar_settlement:0 "The Postwar Settlement"
 TFR_SPA_the_postwar_settlement_desc:0 "Resolving lingering ideological and property disputes from the civil war creates lasting political stability, reassuring investors and establishing an unshakeable institutional foundation for the regime."
 TFR_SPA_national_stabilisation:0 "National Stabilisation"
 TFR_SPA_national_stabilisation_desc:0 "Comprehensive monetary stabilization, price controls, and balanced state expenditure conquer wartime inflation, restoring confidence in the peseta and laying the groundwork for sustained industrial expansion."
 TFR_SPA_national_research_council:0 "National Research Council"
 TFR_SPA_national_research_council_desc:0 "Founding the Consejo Superior de Investigaciones Científicas concentrates scientific talent and state funding, ensuring Spain develops independent capabilities in industrial chemistry, metallurgy, and physics."
 TFR_SPA_a_reconstructed_spain:0 "A Reconstructed Spain"
 TFR_SPA_a_reconstructed_spain_desc:0 "Through discipline, sacrifice, and coordinated state action, Spain rises from the ashes of fratricidal war as a modern, unified, and self-sufficient European power ready to shape its own destiny."
 TFR_SPA_national_economic_plan:0 "National Economic Plan"
 TFR_SPA_national_economic_plan_desc:0 "A rigorous, state-directed five-year economic programme coordinates investments across agriculture, mining, heavy industry, and logistics, ending chaotic piecemeal rebuilding."
 TFR_SPA_reopen_northern_industry:0 "Reopen Northern Industry"
 TFR_SPA_reopen_northern_industry_desc:0 "The steel mills, foundries, and heavy manufacturing plants of the Cantabrian coast and Vizcaya must be cleared of wartime debris, repaired, and brought back into full operation."
 TFR_SPA_restore_transport_links:0 "Restore Transport Links"
 TFR_SPA_restore_transport_links_desc:0 "Reconnecting blasted mountain tunnels, blown bridges, and damaged highway networks allows goods, agricultural produce, and raw materials to move freely between provinces."
 TFR_SPA_hydroelectric_development:0 "Hydroelectric Development"
 TFR_SPA_hydroelectric_development_desc:0 "Damming the swift rivers of the Pyrenees and the Cantabrian range generates abundant, cheap electricity to power our burgeoning chemical and metallurgical factories."
 TFR_SPA_industrial_credit_programme:0 "Industrial Credit Programme"
 TFR_SPA_industrial_credit_programme_desc:0 "Direct state guarantees and low-interest credits through the central bank provide domestic entrepreneurs and industrial syndicates with the capital needed to purchase modern equipment."
 TFR_SPA_reopen_the_national_arsenals:0 "Reopen the National Arsenals"
 TFR_SPA_reopen_the_national_arsenals_desc:0 "The state armories in Toledo, Trubia, and Seville possess the machinery and institutional memory needed to mass-produce rifles, machine guns, and field ammunition for our armed forces."
 TFR_SPA_regional_armament_workshops:0 "Regional Armament Workshops"
 TFR_SPA_regional_armament_workshops_desc:0 "Decentralizing munitions production into provincial workshops across Andalusia, Castile, and the North ensures our armed forces remain supplied even if major metropolitan centers come under attack."
 TFR_SPA_national_supply_railways:0 "National Supply Railways"
 TFR_SPA_national_supply_railways_desc:0 "Standardizing and reinforcing key rail trunks connecting ports, mines, and industrial centers eliminates logistical bottlenecks and expedites strategic troop movements."
 TFR_SPA_domestic_chemical_industry:0 "Domestic Chemical Industry"
 TFR_SPA_domestic_chemical_industry_desc:0 "Investing in synthetic fuel refineries, fertilizer plants, and acid works reduces our reliance on foreign chemical imports and provides vital precursors for explosives."
 TFR_SPA_german_machine_tools:0 "German Machine Tools"
 TFR_SPA_german_machine_tools_desc:0 "Importing high-precision lathes, milling machines, and heavy presses from Germany revolutionizes our manufacturing tolerances and accelerates factory production speeds."
 TFR_SPA_national_labour_productivity:0 "National Labour Productivity"
 TFR_SPA_national_labour_productivity_desc:0 "Implementing modern factory floor management, technical training, and incentive systems boosts industrial output per worker across all manufacturing sectors."
 TFR_SPA_industrial_coordination:0 "Industrial Coordination"
 TFR_SPA_industrial_coordination_desc:0 "Harmonizing state procurement schedules with private industrial output eliminates waste, coordinates raw material shipments, and stabilizes manufacturing queues."
 TFR_SPA_civilian_development_priority:0 "Civilian Development Priority"
 TFR_SPA_civilian_development_priority_desc:0 "Prioritizing consumer goods production, housing, and civilian infrastructure cements social stability and restores everyday prosperity to communities ravaged by conflict."
 TFR_SPA_public_works_programme:0 "Public Works Programme"
 TFR_SPA_public_works_programme_desc:0 "Massive public construction projects—canals, grain silos, urban drainage, and road networks—modernize the nation's physical landscape while guaranteeing full employment."
 TFR_SPA_metropolitan_industrial_expansion:0 "Metropolitan Industrial Expansion"
 TFR_SPA_metropolitan_industrial_expansion_desc:0 "Expanding the industrial belts surrounding Madrid, Barcelona, and Valencia creates massive manufacturing hubs with direct access to concentrated labor markets."
 TFR_SPA_expand_the_industrial_towns:0 "Expand the Industrial Towns"
 TFR_SPA_expand_the_industrial_towns_desc:0 "Incentivizing manufacturing growth in provincial towns such as Valladolid, Zaragoza, and Linares distributes industrial capacity evenly across the country."
 TFR_SPA_civil_engineering_institutes:0 "Civil Engineering Institutes"
 TFR_SPA_civil_engineering_institutes_desc:0 "Founding specialized polytechnic schools for civil, mining, and structural engineering provides the technical mastery required for complex bridge, dam, and fortification design."
 TFR_SPA_integrated_electricity_network:0 "Integrated Electricity Network"
 TFR_SPA_integrated_electricity_network_desc:0 "Linking regional power grids into a synchronized national high-voltage network prevents blackouts and ensures surplus northern hydropower can energize southern factories."
 TFR_SPA_mass_production_standards:0 "Mass Production Standards"
 TFR_SPA_mass_production_standards_desc:0 "Adopting standardized industrial parts, screw threads, and assembly-line workflows eliminates craft bottlenecking and allows Spanish industry to manufacture at scale."
 TFR_SPA_interchangeable_components:0 "Interchangeable Components"
 TFR_SPA_interchangeable_components_desc:0 "Enforcing strict blueprint tolerances across all suppliers ensures machine parts, vehicle spares, and weapon components can be swapped without field modification."
 TFR_SPA_factory_technical_schools:0 "Factory Technical Schools"
 TFR_SPA_factory_technical_schools_desc:0 "Establishing apprentice workshops directly inside manufacturing plants trains young workers in precision machining, electrical wiring, and metallurgy."
 TFR_SPA_flexible_production_lines:0 "Flexible Production Lines"
 TFR_SPA_flexible_production_lines_desc:0 "Designing factory tooling that can re-tool quickly between civilian and military variants minimizes downtime when production priorities shift."
 TFR_SPA_national_armament_contracts:0 "National Armament Contracts"
 TFR_SPA_national_armament_contracts_desc:0 "Long-term guaranteed state contracts for defense equipment incentivize private manufacturers to invest in heavy capital machinery and plant expansion."
 TFR_SPA_industrial_subcontracting:0 "Industrial Subcontracting"
 TFR_SPA_industrial_subcontracting_desc:0 "Distributing parts manufacturing among specialized small workshops and secondary firms maximizes output while freeing primary factories for final assembly."
 TFR_SPA_spanish_industrial_research:0 "Spanish Industrial Research"
 TFR_SPA_spanish_industrial_research_desc:0 "Dedicated laboratory research into local ore processing, advanced alloys, and synthetic materials unlocks greater value from our domestic natural wealth."
 TFR_SPA_advanced_machine_tooling:0 "Advanced Machine Tooling"
 TFR_SPA_advanced_machine_tooling_desc:0 "Domestic manufacture of heavy stamping dies, precision grinding equipment, and hydraulic presses frees Spanish heavy industry from foreign technological dependence."
 TFR_SPA_domestic_materials_programme:0 "Domestic Materials Programme"
 TFR_SPA_domestic_materials_programme_desc:0 "Maximizing the extraction and refining of Spanish iron, coal, pyrites, and tungsten creates a self-contained industrial supply chain immune to foreign blockades."
 TFR_SPA_production_scheduling:0 "Production Scheduling"
 TFR_SPA_production_scheduling_desc:0 "Implementing centralized statistical monitoring and lean inventory management ensures raw materials arrive at production lines precisely when needed."
 TFR_SPA_industrial_conversion_offices:0 "Industrial Conversion Offices"
 TFR_SPA_industrial_conversion_offices_desc:0 "Designating specialized conversion planning offices ensures civilian factories—such as textile mills, locomotive works, and breweries—can instantly transition to wartime production."
 TFR_SPA_war_industry_expansion:0 "War Industry Expansion"
 TFR_SPA_war_industry_expansion_desc:0 "Directing significant state resources into expanding tank factories, shell-filling plants, and gun forges prepares the nation for high-intensity modern warfare."
 TFR_SPA_national_industrial_network:0 "National Industrial Network"
 TFR_SPA_national_industrial_network_desc:0 "A fully integrated industrial ecosystem connecting raw material basins, energy grids, and assembly plants turns Spain into an economic fortress."
 TFR_SPA_an_iberian_economic_powerhouse:0 "An Iberian Economic Powerhouse"
 TFR_SPA_an_iberian_economic_powerhouse_desc:0 "With modern infrastructure, resilient industrial capacity, and disciplined labor, Spain claims its status as an economic powerhouse in the Mediterranean and European basin."
 TFR_SPA_establish_a_unified_command:0 "Establish a Unified Command"
 TFR_SPA_establish_a_unified_command_desc:0 "Unifying the diverse factions, regional commands, and militias into a single, cohesive military command structure restores discipline and unified strategic purpose to the Army."
 TFR_SPA_officer_training_programme:0 "Officer Training Programme"
 TFR_SPA_officer_training_programme_desc:0 "Modernizing the curricula of the General Military Academy in Zaragoza trains a new generation of officers grounded in combined arms warfare and tactical initiative."
 TFR_SPA_infantry_equipment_modernisation:0 "Infantry Equipment Modernisation"
 TFR_SPA_infantry_equipment_modernisation_desc:0 "Equipping our infantry with standardized modern Mauser rifles, submachine guns, light mortars, and protective gear dramatically increases the combat effectiveness of line divisions."
 TFR_SPA_artillery_modernisation:0 "Artillery Modernisation"
 TFR_SPA_artillery_modernisation_desc:0 "Reorganizing our artillery regiments with modern howitzers, rapid-firing guns, and standardized calibers ensures overwhelming firepower on the battlefield."
 TFR_SPA_army_supply_service:0 "Army Supply Service"
 TFR_SPA_army_supply_service_desc:0 "Creating a professionalized Quartermaster and Logistics Corps guarantees that food, ammunition, and medical supplies reach frontline units under all operational conditions."
 TFR_SPA_army_motor_transport:0 "Army Motor Transport"
 TFR_SPA_army_motor_transport_desc:0 "Replacing horse-drawn baggage trains with standardized trucks and utility vehicles allows infantry divisions to redeploy rapidly across difficult terrain."
 TFR_SPA_field_communications:0 "Field Communications"
 TFR_SPA_field_communications_desc:0 "Distributing portable two-way radios, field telephones, and encoding systems down to the battalion level ensures seamless real-time coordination during fluid operations."
 TFR_SPA_mobile_maintenance_workshops:0 "Mobile Maintenance Workshops"
 TFR_SPA_mobile_maintenance_workshops_desc:0 "Equipping motorized repair vans and mobile repair depots ensures that broken vehicles, artillery pieces, and radios are returned to service quickly near the front lines."
 TFR_SPA_mountain_warfare_schools:0 "Mountain Warfare Schools"
 TFR_SPA_mountain_warfare_schools_desc:0 "Capitalizing on Spain's rugged terrain, specialized mountain training schools in the Pyrenees and Guadarrama mold elite alpine units capable of dominating high-altitude passes."
 TFR_SPA_amphibious_warfare_school:0 "Amphibious Warfare School"
 TFR_SPA_amphibious_warfare_school_desc:0 "Drawing lessons from the historic Alhucemas landings, an amphibious warfare academy trains assault troops and naval gunners for contested coastal operations."
 TFR_SPA_general_staff_exercises:0 "General Staff Exercises"
 TFR_SPA_general_staff_exercises_desc:0 "Large-scale map maneuvers and field war games allow the High Command to refine complex operational plans, logistics timetables, and multi-corps maneuvers."
 TFR_SPA_modern_army_standards:0 "Modern Army Standards"
 TFR_SPA_modern_army_standards_desc:0 "Codifying standardized divisional organizations, doctrine manuals, and readiness inspections elevates the Spanish Army to contemporary European military standards."
 TFR_SPA_military_development_priority:0 "Military Development Priority"
 TFR_SPA_military_development_priority_desc:0 "Declaring military readiness as the supreme state priority ensures our armed forces receive primary access to national budgets, raw materials, and industrial output."
 TFR_SPA_the_staff_academy:0 "The Staff Academy"
 TFR_SPA_the_staff_academy_desc:0 "Reopening the Escuela Superior del Ejército ensures that staff officers are trained in modern operational art, grand strategy, and inter-service coordination."
 TFR_SPA_professional_nco_corps:0 "Professional NCO Corps"
 TFR_SPA_professional_nco_corps_desc:0 "Investing in seasoned non-commissioned officers as the backbone of our combat units guarantees steadfast small-unit leadership in the face of enemy fire."
 TFR_SPA_infantry_fire_coordination:0 "Infantry Fire Coordination"
 TFR_SPA_infantry_fire_coordination_desc:0 "Integrating heavy machine guns, light mortars, and rifle fire into mutually supporting fire pockets maximizes defensive resilience and offensive shock."
 TFR_SPA_artillery_liaison_officers:0 "Artillery Liaison Officers"
 TFR_SPA_artillery_liaison_officers_desc:0 "Attaching trained forward artillery observers directly to front-line assault companies allows precision artillery barrages to be called in within minutes."
 TFR_SPA_assault_engineering:0 "Special Forces Training"
 TFR_SPA_assault_engineering_desc:0 "Forming elite assault engineer and commando units equipped with flamethrowers, demolition charges, and submachine guns enables the rapid reduction of enemy strongpoints."
 TFR_SPA_armoured_formations:0 "Armoured Formations"
 TFR_SPA_armoured_formations_desc:0 "Concentrating tanks and armored fighting vehicles into dedicated mobile brigades rather than dispersing them across infantry units establishes a decisive offensive punch."
 TFR_SPA_mobile_repair_columns:0 "Mobile Repair Columns"
 TFR_SPA_mobile_repair_columns_desc:0 "Dedicated heavy recovery vehicles and mobile tank workshops follow directly behind armored advances to recover and repair disabled armor under fire."
 TFR_SPA_motorised_combat_groups:0 "Motorised Combat Groups"
 TFR_SPA_motorised_combat_groups_desc:0 "Pairing motorized infantry with mobile anti-tank guns and self-propelled artillery creates agile combat teams capable of holding flanks and exploiting breakthrough gaps."
 TFR_SPA_deep_supply_depots:0 "Deep Supply Depots"
 TFR_SPA_deep_supply_depots_desc:0 "Constructing dispersed, fortified supply dumps along major operational axes insulates field armies from supply interdiction and enables sustained offensive pushes."
 TFR_SPA_integrated_signal_companies:0 "Integrated Signal Companies"
 TFR_SPA_integrated_signal_companies_desc:0 "Dedicated divisional signal units equipped with high-powered wireless transmitters ensure corps commanders maintain continuous situational awareness."
 TFR_SPA_operational_planning:0 "Operational Planning"
 TFR_SPA_operational_planning_desc:0 "Advanced staff techniques in calculating march rates, supply consumption, and tactical schedules turn battlefield intuition into mathematically sound victory."
 TFR_SPA_special_forces_command:0 "Special Forces Command"
 TFR_SPA_special_forces_command_desc:0 "Establishing a unified special operations command harmonizes doctrine, training, and equipment for mountain troops, marine commandos, and legionnaires."
 TFR_SPA_rapid_force_concentration:0 "Rapid Force Concentration"
 TFR_SPA_rapid_force_concentration_desc:0 "Drilling rapid rail and motorized deployment protocols allows the Army to assemble overwhelming numerical superiority at decisive points along the front."
 TFR_SPA_modern_fire_support:0 "Modern Fire Support"
 TFR_SPA_modern_fire_support_desc:0 "Integrating heavy mortars, infantry support guns, and specialized anti-tank batteries ensures our line infantry can neutralize any armored or entrenched threat."
 TFR_SPA_unified_operational_doctrine:0 "Unified Operational Doctrine"
 TFR_SPA_unified_operational_doctrine_desc:0 "A single, coherent fighting doctrine shared by armor, infantry, artillery, and air support ensures all arms fight as one synchronized machine."
 TFR_SPA_armoured_breakthrough:0 "Armoured Breakthrough"
 TFR_SPA_armoured_breakthrough_desc:0 "Developing aggressive armored breakthrough doctrine enables our armored spearheads to pierce deeply into enemy rear areas and encircle opposing armies."
 TFR_SPA_expanded_officer_corps:0 "Expanded Officer Corps"
 TFR_SPA_expanded_officer_corps_desc:0 "Expanding officer training capacity produces the commanders required to lead our growing multi-corps armies without sacrificing tactical proficiency."
 TFR_SPA_a_war_of_manoeuvre:0 "A War of Manoeuvre"
 TFR_SPA_a_war_of_manoeuvre_desc:0 "Rejecting static trench warfare in favor of aggressive maneuver, speed, and continuous pressure keeps the enemy off-balance and dictates the pace of battle."
 TFR_SPA_a_professional_spanish_army:0 "A Professional Spanish Army"
 TFR_SPA_a_professional_spanish_army_desc:0 "With modern doctrine, disciplined leadership, and advanced combined-arms equipment, the Spanish Army stands as a world-class fighting force ready to defend the nation's honor."
 TFR_SPA_establish_the_air_command:0 "Reorganise the Air Command"
 TFR_SPA_establish_the_air_command_desc:0 "Reconstituting the Ejercito del Aire as an independent, unified armed service with its own Air Staff establishes centralized control over all military aviation assets."
 TFR_SPA_reopen_aeronautical_works:0 "Rebuild Aeronautical Industry"
 TFR_SPA_reopen_aeronautical_works_desc:0 "Revitalizing aeronautical assembly plants such as CASA and Hispano-Suiza enables the domestic manufacture and repair of aircraft airframes and engines."
 TFR_SPA_national_aircraft_design_bureaus:0 "Lessons of the Condor Legion"
 TFR_SPA_national_aircraft_design_bureaus_desc:0 "Incorporating combat lessons and technical data shared by foreign volunteer pilots guides our designers in developing agile, robust fighters and tactical bombers."
 TFR_SPA_pilot_training_schools:0 "Pilot Training and Maintenance"
 TFR_SPA_pilot_training_schools_desc:0 "Establishing rigorous flight academies and aircraft mechanic schools ensures our pilots enter combat fully trained and our planes are maintained at peak readiness."
 TFR_SPA_forward_airfield_network:0 "Forward Airfield Network"
 TFR_SPA_forward_airfield_network_desc:0 "Paving, fueling, and expanding forward airstrips across the peninsula and Mediterranean islands enables our squadrons to disperse safely and deploy rapidly."
 TFR_SPA_fighter_modernisation_programme:0 "Fighter Modernisation Programme"
 TFR_SPA_fighter_modernisation_programme_desc:0 "Prioritizing high-performance monoplane fighters equipped with powerful inline engines and heavy cannon armament secures undisputed control over Spanish skies."
 TFR_SPA_tactical_aviation_school:0 "Tactical Aviation School"
 TFR_SPA_tactical_aviation_school_desc:0 "Specialized training in close air support, dive bombing, and frontline reconnaissance turns the Air Force into a flying artillery wing for ground armies."
 TFR_SPA_aircraft_warning_network:0 "Aircraft Warning Network"
 TFR_SPA_aircraft_warning_network_desc:0 "Constructing optical observation posts, radio listening posts, and coastal radar installations ensures early warning against incoming enemy bombing raids."
 TFR_SPA_all_weather_air_operations:0 "All-Weather Air Operations"
 TFR_SPA_all_weather_air_operations_desc:0 "Advanced instrument flight training and navigational aids allow Spanish pilots to conduct combat sorties and night interceptions through adverse weather conditions."
 TFR_SPA_establish_the_naval_staff:0 "Establish the Naval Staff"
 TFR_SPA_establish_the_naval_staff_desc:0 "Reorganizing the Armada's High Command creates a focused naval staff dedicated to protecting our sea lanes, maritime borders, and overseas possessions."
 TFR_SPA_reopen_the_ferrol_shipyards:0 "Reopen the Ferrol Shipyards"
 TFR_SPA_reopen_the_ferrol_shipyards_desc:0 "Repairing dry docks, slipways, and heavy cranes at the historic naval arsenal of El Ferrol restarts large-scale warship construction and overhaul."
 TFR_SPA_shipyard_coordination:0 "Shipyard Coordination"
 TFR_SPA_shipyard_coordination_desc:0 "Coordinating warship construction schedules between Ferrol, Cartagena, and Cadiz prevents bottlenecks in steel allocation and specialized naval components."
 TFR_SPA_naval_bases_programme:0 "Naval Bases Programme"
 TFR_SPA_naval_bases_programme_desc:0 "Fortifying, deepening, and restocking our primary naval stations at Cartagena, Cadiz, Ferrol, and the Balearic Islands shields the fleet from surprise attack."
 TFR_SPA_rebuild_the_merchant_marine:0 "Rebuild the Merchant Marine"
 TFR_SPA_rebuild_the_merchant_marine_desc:0 "Constructing modern freighters, coastal transports, and tankers restores our merchant fleet, ensuring vital imports and island trade continue uninterrupted."
 TFR_SPA_convoy_escort_procedures:0 "Convoy Escort Procedures"
 TFR_SPA_convoy_escort_procedures_desc:0 "Developing standardized convoy routing, night-screening tactics, and depth-charge attack patterns shields our merchant vessels from hostile submarine packs."
 TFR_SPA_anti_submarine_patrols:0 "Anti Submarine Patrols"
 TFR_SPA_anti_submarine_patrols_desc:0 "Organizing dedicated ASW hunting groups equipped with modern hydrophones, sonars, and patrol craft clears enemy submarines from our coastal waters."
 TFR_SPA_coastal_air_coordination:0 "Coastal Air Coordination"
 TFR_SPA_coastal_air_coordination_desc:0 "Establishing joint coordination between naval flotillas and maritime patrol aircraft extends our reconnaissance reach and detects enemy fleets hundreds of miles offshore."
 TFR_SPA_the_destroyer_programme:0 "The Destroyer Programme"
 TFR_SPA_the_destroyer_programme_desc:0 "Mass-producing fast, heavily armed fleet destroyers equipped with torpedo batteries and anti-aircraft guns provides essential screens for larger capital ships."
 TFR_SPA_the_cruiser_programme:0 "The Cruiser Programme"
 TFR_SPA_the_cruiser_programme_desc:0 "Commissioning modern light and heavy cruisers provides the speed, firepower, and sea-keeping needed for independent ocean commerce protection and Mediterranean control."
 TFR_SPA_fleet_repair_service:0 "Fleet Repair Service"
 TFR_SPA_fleet_repair_service_desc:0 "Equipping specialized naval repair ships and auxiliary tenders enables battle-damaged warships to undergo emergency repairs without immediately returning to port."
 TFR_SPA_expand_the_naval_arsenals:0 "Expand the Naval Arsenals"
 TFR_SPA_expand_the_naval_arsenals_desc:0 "Expanding specialized naval gun foundries, armor plate rolling mills, and optical rangefinder workshops ensures domestic self-sufficiency in warship outfitting."
 TFR_SPA_submarine_design_bureau:0 "Submarine Design Bureau"
 TFR_SPA_submarine_design_bureau_desc:0 "Founding a dedicated submarine engineering bureau develops stealthy, long-range patrol submarines tailored for Atlantic raiding and Mediterranean choke points."
 TFR_SPA_silent_patrol_tactics:0 "Silent Patrol Tactics"
 TFR_SPA_silent_patrol_tactics_desc:0 "Training submarine captains in quiet running, thermal layer evasion, and coordinated torpedo attacks maximizes lethality while reducing submarine losses."
 TFR_SPA_atlantic_operations:0 "Atlantic Operations"
 TFR_SPA_atlantic_operations_desc:0 "Developing long-range replenishment at sea and deep-water navigational protocols allows the Armada to conduct sustained naval operations far into the Atlantic."
 TFR_SPA_escort_fleet_doctrine:0 "Escort Fleet Doctrine"
 TFR_SPA_escort_fleet_doctrine_desc:0 "Focusing naval resources and doctrine on tireless escort duties, ASW patrol lines, and convoy defense safeguards Spain's lifeline of maritime commerce."
 TFR_SPA_surface_fleet_doctrine:0 "Surface Fleet Doctrine"
 TFR_SPA_surface_fleet_doctrine_desc:0 "Focusing our naval doctrine on aggressive cruiser sweeps, surface torpedo night-actions, and decisive fleet engagements contests command of Mediterranean waters."
 TFR_SPA_integrated_naval_logistics:0 "Integrated Naval Logistics"
 TFR_SPA_integrated_naval_logistics_desc:0 "Synchronizing naval fuel reserves, ammunition depots, and dockyard spare parts ensures our fleets spend maximum time on patrol and minimum time awaiting supply."
 TFR_SPA_fleet_cooperation:0 "Fleet Cooperation"
 TFR_SPA_fleet_cooperation_desc:0 "Combined fleet maneuvers and joint tactical training between battleships, cruisers, destroyers, and submarines turn disparate vessels into a cohesive battle fleet."
 TFR_SPA_an_iberian_naval_power:0 "An Iberian Naval Power"
 TFR_SPA_an_iberian_naval_power_desc:0 "With reinforced bases, modern warships, and battle-tested crews, the Armada Española reasserts Spain's status as a pre-eminent maritime power in Europe."
 TFR_SPA_economy_dynamic:0 "Spanish Economy"
 TFR_SPA_economy_dynamic_desc:0 "Reflects the structural capacity, factory output, construction speed, and recovery progress of the Spanish economy following the devastations of the civil war."
 TFR_SPA_army_dynamic:0 "Spanish Armed Forces"
 TFR_SPA_army_dynamic_desc:0 "Reflects the doctrine, organizational discipline, combined arms efficiency, and operational firepower of the Spanish Armed Forces."
 TFR_SPA_air_dynamic:0 "Spanish Air Force"
 TFR_SPA_air_dynamic_desc:0 "Represents the flight doctrine, aircraft modernization, pilot readiness, and tactical air coordination of the Spanish Air Force."
 TFR_SPA_navy_dynamic:0 "Spanish Navy"
 TFR_SPA_navy_dynamic_desc:0 "Represents the naval doctrine, escort protection, convoy interdiction, and dockyard modernization of the Spanish Navy."
 TFR_SPA_rebuild_asturias:0 "Rebuild Asturias"
 TFR_SPA_rebuild_asturias_desc:0 "Fund a regional reconstruction project. On completion, the highlighted state gains one building slot and one infrastructure level. The political power cost is refunded if control is lost."
 TFR_SPA_rebuild_aragon:0 "Reconnect Western Aragon"
 TFR_SPA_rebuild_aragon_desc:0 "Fund a regional reconstruction project. On completion, the highlighted state gains one building slot and one infrastructure level. The political power cost is refunded if control is lost."
 TFR_SPA_rebuild_andalusia:0 "Restore Andalusian Infrastructure"
 TFR_SPA_rebuild_andalusia_desc:0 "Fund a regional reconstruction project. On completion, the highlighted state gains one building slot and one infrastructure level. The political power cost is refunded if control is lost."
 TFR_SPA_standardise_subcontractors:0 "Standardise Industrial Subcontractors"
 TFR_SPA_standardise_subcontractors_desc:0 "Fund a one-time development project. Its permanent improvements are integrated into the national dynamic modifier when the project finishes."
 TFR_SPA_motor_pool_trials:0 "Conduct Motor Pool Trials"
 TFR_SPA_motor_pool_trials_desc:0 "Fund a one-time development project. Its permanent improvements are integrated into the national dynamic modifier when the project finishes."
 TFR_SPA_volunteer_role_tt:0 "Spain permanently supports its partners through volunteers. Cannot join or create factions, declare wars, or join foreign wars. Defensive wars remain possible. Portugal remains independent."
 TFR_SPA_postwar_ready_tt:0 "Finish the Spanish Civil War as Franco's Nationalist Spain before starting this focus."
 TFR_SPA_war_role_tt:0 "Spain may join the Axis and participate directly in its wars. The Portuguese annexation and integration route is available from 1939."
 TFR_SPA_membership_tt:0 "Germany receives a membership request and may accept or refuse it. A refused request can be renewed through decisions."
 TFR_SPA_resource_rights_tt:0 "Gain resource rights to all Portuguese resources, including coal. Portuguese infrastructure becomes level 5."
 TFR_SPA_relocation_tt:0 "Move the civilian factories, military factories and dockyards actually present in mainland Portugal into Spain, with building slots. Remove the transferred buildings from Portugal and end its scripted industry growth. Any pending transfer is retried daily."
 TFR_SPA_main_war_tt:0 "The additional wartime modifiers apply only while Spain and Germany fight the same enemy major power as members of the same faction. War against Portugal alone does not qualify."
 TFR_SPA_war_commitment_tt:0 "Additional factory output and army organization apply while Spain and Germany fight the same enemy major power in the same faction. War against Portugal alone does not qualify."
 TFR_SPA_war_coordination_tt:0 "Additional army recovery applies while Spain and Germany fight the same enemy major power in the same faction. War against Portugal alone does not qualify."
 TFR_SPA_recovery_import_tt:0 "The current recovery stage is preserved in Spanish Economy. Existing research slots and more advanced mobilisation laws are preserved."
 TFR_SPA_recovery_2_tt:0 "Recovery advances to at least stage 2: factory and dockyard output -14%, construction speed -7%, consumer goods factor +15%."
 TFR_SPA_recovery_3_tt:0 "Recovery advances to at least stage 3: factory and dockyard output -7%, construction speed -4%, consumer goods factor +10%."
 TFR_SPA_recovery_clear_tt:0 "Remove all remaining civil war economic recovery penalties."
 TFR_SPA_recovery_programme_1_tt:0 "Start the original five-year National Recovery programme in Spanish Economy: weekly stability +0.20% and consumer goods factor -15%. A more advanced existing programme is preserved."
 TFR_SPA_recovery_programme_2_tt:0 "Advance National Recovery to at least stage 2: retain its consumer goods and weekly stability bonuses and gain +10% infrastructure construction speed. The original programme expiry date is preserved."
 TFR_SPA_recovery_programme_3_tt:0 "Advance National Recovery to at least stage 3: consumer goods factor -25% and infrastructure construction speed +10%, replacing the temporary weekly stability bonus. Equivalent permanent consumer-goods bonuses do not stack twice."
 TFR_SPA_diplomatic_cooperation:0 "Spanish Diplomatic Cooperation"
 TFR_SPA_diplomatic_cooperation_desc:0 "Diplomatic channels and bilateral arrangements governing Spain's role alongside European partners and alignment with foreign powers."
 TFR_SPA_renew_axis_request:0 "Renew the Axis Membership Request"
 TFR_SPA_renew_axis_request_desc:0 "Ask Germany to reconsider Spanish membership of the Axis."
 TFR_SPA_regional_reconstruction:0 "Regional Reconstruction"
 TFR_SPA_regional_reconstruction_desc:0 "Restore transport and development capacity in regions damaged by the civil war."
 TFR_SPA_development_projects:0 "National Development Projects"
 TFR_SPA_development_projects_desc:0 "Turn the programmes established by our national focuses into practical improvements."
 TFR_SPA_national_service_campaign:0 "Promote National Service"
 TFR_SPA_national_service_campaign_desc:0 "Build public support for national service at the expense of domestic stability."
 TFR_spain_rework.1.t:0 "Spain Requests Axis Membership"
 TFR_spain_rework.1.d:0 "Spain has committed to direct participation in the Axis war effort and requests admission to our faction."
 TFR_spain_rework.1.a:0 "Welcome Spain into the Axis."
 TFR_spain_rework.1.b:0 "Refuse the request."
 TFR_spain_rework.2.t:0 "Germany Accepts Spanish Membership"
 TFR_spain_rework.2.d:0 "Spain has joined the Axis. Participation in its wars can now be arranged through normal diplomacy."
 TFR_spain_rework.3.t:0 "Germany Refuses Spanish Membership"
 TFR_spain_rework.3.d:0 "Germany has declined our request, or changed diplomatic circumstances have prevented admission. We can renew our request through diplomatic decisions when eligible."
 TFR_spain_rework.4.t:0 "Portuguese Industry Relocated"
 TFR_spain_rework.4.d:0 "The agreed civilian, military and naval production facilities have been moved into Spain. Portugal remains independent and its resource agreement remains in force."
 TFR_spain_rework.5.t:0 "The National Labour Accords"
 TFR_spain_rework.5.d:0 "Employers and labour representatives have agreed on a framework for rebuilding Spain. The government must now decide whether to reassure exhausted communities or demand greater sacrifices for national mobilisation. The economic recovery programme will continue under either settlement."
 TFR_spain_rework.5.a:0 "Prioritise reconciliation and social peace."
 TFR_spain_rework.5.b:0 "Ask the nation to prepare for greater sacrifices."
 TFR_spain_rework.continue:0 "Understood."
