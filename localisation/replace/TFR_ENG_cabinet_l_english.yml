 tfr_eng_cabinet.80.t:0 "The Business of 'C'"
 tfr_eng_cabinet.80.d:0 "Sir Stewart Menzies has taken his seat in the War Cabinet: there are men and money enough to build up either the codebreakers of Bletchley Park or the new special operations, but not both. He wants the Prime Minister's decision before the week is out."
 tfr_eng_cabinet.80.a:0 "Read the enemy's mind: signals intelligence."
 tfr_eng_cabinet.80.b:0 "Set Europe ablaze: special operations."

 ENG_war_cabinet_category:0 "The War Cabinet"
 ENG_war_cabinet_category_desc:0 "The ministers of the War Cabinet have their own levers to pull."
 ENG_beaverbrook_mass_production:0 "Beaverbrook's Production Drive"
 ENG_beaverbrook_mass_production_desc:0 "Beaverbrook orders the aircraft factories to tear up their routine and build flat out."
 ENG_moi_dig_for_victory:0 "Dig for Victory"
 ENG_moi_dig_for_victory_desc:0 "Gardens, parks and railway verges are turned over to vegetables."
 ENG_moi_careless_talk_costs_lives:0 "Careless Talk Costs Lives"
 ENG_moi_careless_talk_costs_lives_desc:0 "Posters in every pub and railway carriage warn that the enemy is listening."
 ENG_moi_wings_for_victory:0 "Wings for Victory"
 ENG_moi_wings_for_victory_desc:0 "Towns compete to raise the price of a Spitfire or a Lancaster in savings bonds."

