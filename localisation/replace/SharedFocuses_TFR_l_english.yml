  AXIS_germany_tank_research:0 "Modern Tank Prototypes"
  AXIS_germany_tank_research_desc:0 "Invest in research and development to create modern prototypes of German tanks, allowing for the potential introduction of more powerful and effective armored units but at the cost of increased resource allocation to research and development."
  AXIS_germany_massmob:0 "Totaler Krieg Recruitment"
