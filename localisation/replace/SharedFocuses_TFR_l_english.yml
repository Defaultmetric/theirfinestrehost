  AXIS_spain_unknown_specialization_desc:0 "Choose a specialization for Spanish forces to enhance their capabilities in a specific area, such as infantry, armor, artillery, or air power. Each specialization provides unique bonuses and advantages but may limit flexibility in other areas. Choose wisely to maximize the effectiveness of your forces on the battlefield."

  AXIS_germany_specialization:0 "German Asymmetric Specialization"
  AXIS_germany_specialization_desc:0 "The Asymetric Specialization provides multiple bonuses to cover all areas of the German military, but at the cost of reduced specialization and effectiveness in any one area. This specialization allows for a more balanced and versatile military, but may struggle against more specialized opponents in certain areas."
  AXIS_germany_massmob_mobilization:0 "Expand Military Enrollment"
  AXIS_germany_massmob_mobilization_desc:0 "Focus on mass mobilization to rapidly expand the German army's size and manpower, allowing for large-scale offensives and defensive operations but at the cost of reduced training and equipment quality."
