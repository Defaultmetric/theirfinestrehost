  EQ_MOD_CAT_tank_reliability_module_TITLE:0 "Reliability Modules"

  fire_extinguisher:0 "Fire Extinguisher System"
  fire_extinguisher_desc:0 "A basic fire suppression system that helps protect the crew and vehicle from catastrophic fire damage. Reduces losses from fires but requires manual activation."

  auto_fire_extinguisher:0 "Automatic Fire Suppression"
  auto_fire_extinguisher_desc:0 "An automated system that detects and extinguishes fires without crew input. Increases crew survivability by reacting instantly to onboard fires."

  auto_fire_wet_ammo:0 "Auto Fire Suppression & Wet Ammo Rack"
  auto_fire_wet_ammo_desc:0 "An advanced integrated system combining automatic fire suppression with wet ammunition storage. Offers excellent protection by preventing fire-related explosions and improving crew safety in combat situations."

  computer_guided_stabilizer:0 "Computer-Guided Stabilizer"
  computer_guided_stabilizer_desc:0 "A stabilization system assisted by a primitive onboard analog computer. Enhances targeting precision while moving, helping maintain fire accuracy in mobile combat. Complex and expensive, but highly effective in modern mechanized warfare."

  HE_shells:0 "High-Explosive Shells"
  HE_shells_desc:0 "High-explosive shells designed to maximize damage against soft targets"

  tank_hybrid_armor:0 "Hybrid Armor"
  tank_hybrid_armor_desc:0 "Riveted plates reinforced with simple seam welds. Cheap and easy to produce, removes the reliability drawbacks of pure rivets without adding protection or requiring chromium."

 tank_log_armor:0 "Tied Logs"
 tank_log_armor_desc:0 "Improvised logs tied to the hull with rope. Very cheap field fix that adds almost no real protection; may help against splinters and small-arms and can aid recovery when bogged."

 APCR_shells:0 "APCR Shells"
 APCR_shells_desc:0 "Armor-Piercing Composite Rigid rounds with a hardened core (often tungsten) fired at very high velocity. Strong short-range penetration vs. vertical armor, but loses effectiveness quickly with range and slope, and has limited post-penetration effect."


  blank_localisation:0 "Module Blank"

  tank_t34_85_turret:0 "T-34/85 Turret"
  tank_t34_85_turret_desc:0 "The T-34/85 turret is a significant upgrade over the earlier T-34 turret, featuring a larger three-man design that improves crew efficiency and combat effectiveness."
  t34_85_medium_turret:0 "T-34/85 Turret" 
  EQ_MOD_CAT_t34_85_medium_turret_TITLE:0 "T-34/85 Turret"
  t34_85_armament:0 "T34-85 Upgrade Modules"
  tank_85mm_cannon:0 "85mm ZiS-S-53 Cannon"
  tank_85mm_cannon_desc:0 "The 85mm ZiS-S-53 cannon provides the T-34/85 with significantly improved firepower, capable of engaging enemy armor at greater ranges and with higher penetration compared to the previous 76.2mm gun."
  EQ_MOD_CAT_tank_t34_main_armament_TITLE:0 "T-34/85mm Cannon"

  front_sloped_armor:0 "Front Sloped Armor"
  front_sloped_armor_desc:0 "Sloped armor on the front of the tank increases effective thickness and improves deflection of incoming rounds, enhancing survivability against enemy fire."
  full_sloped_armor:0 "Fully Sloped Armor"
  full_sloped_armor_desc:0 "Sloped armor on all sides of the tank increases effective thickness and improves deflection of incoming rounds, significantly enhancing survivability against enemy fire from all directions."
  EQ_MOD_CAT_tank_armor_protection_type_TITLE:0 "Armor Configuration"
  sloped_armor_tech:0 "Sloped Armor Technology"
  EQ_MOD_CAT_tank_stabilizers_TITLE:0 "Tank Stabilizers"
  EQ_MOD_CAT_tank_large_superstructure_m_cat_TITLE:0 "Medium Casemate II"
  tank_large_superstructure_m_desc:0 "A casemate-style turret with a fixed gun mount, designed to accommodate medium cannons. Offers improved protection and allows for larger guns without the complexity of a rotating turret, but sacrifices all-around traverse and flexibility in targeting."
  EQ_MOD_CAT_tank_large_superstructure_h_cat_TITLE:0 "Heavy Casemate II"
  tank_large_superstructure_h_desc:0 "A casemate-style turret with a fixed gun mount, designed to accommodate heavy cannons. Offers improved protection and allows for larger guns without the complexity of a rotating turret, but sacrifices all-around traverse and flexibility in targeting."
  tank_medium_howitzer_3:0 "Medium Howitzer III"
  tank_medium_howitzer_3_desc:0 "A medium howitzer designed for indirect fire support. It has a shorter barrel and lower muzzle velocity than a standard medium cannon, but it can fire high-explosive shells at a higher angle, making it effective against entrenched infantry and fortifications."
  tank_heavy_howitzer_3:0 "Heavy Howitzer III"
  tank_heavy_howitzer_3_desc:0 "A heavy howitzer designed for indirect fire support. It has a shorter barrel and lower muzzle velocity than a standard heavy cannon, but it can fire high-explosive shells at a higher angle, making it effective against entrenched infantry and fortifications."
  tank_heavy_howitzer_2:0 "Heavy Howitzer II"
  tank_heavy_howitzer_2_desc:0 "A heavy howitzer designed for indirect fire support. It has a shorter barrel and lower muzzle velocity than a standard heavy cannon, but it can fire high-explosive shells at a higher angle, making it effective against entrenched infantry and fortifications."
  heavy_tank_rocket_launcher:0 "Heavy Rocket Launcher I"
  heavy_tank_rocket_launcher_desc:0 "A large rocket launcher mounted on a heavy tank chassis. It fires powerful rockets that can deal significant damage to both infantry and armored targets, but it has a slow rate of fire and limited range compared to traditional tank guns."
  heavy_tank_rocket_launcher_2:0 "Heavy Rocket Launcher II"
  heavy_tank_rocket_launcher_2_desc:0 "An upgraded version of the heavy rocket launcher, featuring improved payload and accuracy. It can deal even more damage to both infantry and armored targets, but still has a slow rate of fire and limited range compared to traditional tank guns."