  tank_AP_high_velocity_cannon:0 "Medium High-Velocity Cannon III"
  tank_AP_high_velocity_cannon_desc:0 "Advances in armor made us redesign our anti-tank guns with longer barrels and higher muzzle velocities, allowing shells to penetrate even the most heavily armored enemy tanks at greater ranges. More expensive to maintain, higher cost, increased weight, increased piercing."

  tank_s_high_velocity_cannon_1:0 "Small High-Velocity Cannon I"
  tank_s_high_velocity_cannon_1_desc:0 "A cannon specifically designed to achieve a high muzzle velocity. Using specialized ammunition, it has superb anti-armor characteristics, but its performance against soft targets suffers."
  tank_s_high_velocity_cannon_2:0 "Small High-Velocity Cannon II"
  tank_s_high_velocity_cannon_2_desc:0 "A cannon specifically designed to achieve a high muzzle velocity. Using specialized ammunition, it has superb anti-armor characteristics, but its performance against soft targets suffers."
  tank_s_high_velocity_cannon_3:0 "Small High-Velocity Cannon III"
  tank_s_high_velocity_cannon_3_desc:0 "A cannon specifically designed to achieve a high muzzle velocity. Using specialized ammunition, it has superb anti-armor characteristics, but its performance against soft targets suffers."

  tank_h_high_velocity_cannon_1:0 "Heavy High-Velocity Cannon I"
  tank_h_high_velocity_cannon_1_desc:0 "A cannon specifically designed to achieve a high muzzle velocity. Using specialized ammunition, it has superb anti-armor characteristics, but its performance against soft targets suffers."
  tank_h_high_velocity_cannon_2:0 "Heavy High-Velocity Cannon II"
  tank_h_high_velocity_cannon_2_desc:0 "A cannon specifically designed to achieve a high muzzle velocity. Using specialized ammunition, it has superb anti-armor characteristics, but its performance against soft targets suffers."
  tank_medium_cannon_3:0 "Advanced Medium Cannon"
  tank_medium_cannon_3_desc:0 "A general-purpose weapon well suited to a wide variety of tasks. It excells at neither anti-infantry nor anti-tank work, but it provides a vehicle with a lot of flexibility."
  tank_small_cannon_3:0 "Advanced Small Cannon"
  tank_small_cannon_3_desc:0 "A small-caliber cannon that can be mounted on light vehicles. It is effective against infantry and lightly armored targets, but struggles against heavier armor."

