l_english:

 # Focuses (kept ids: British spelling and voice)
 ENG_home_defence:0 "Home Defence"
 ENG_home_defence_desc:0 "The Home Office, the Air Ministry and the War Office have each drawn up their own plans for the defence of these islands. It is time they were made into one."
 # uk_fortify_the_isles / _desc: integration v2 moved them into the patched REPO file localisation/replace/Uk_TFR_l_english.yml
 # (the key already lives there; a second definition in the replace folder would have an uncertain winner)
 air_defense_focus:0 "Air Defence of Great Britain"
 air_defense_focus_desc:0 "The bomber will always get through, Mr Baldwin told the House. We intend to make him pay for every mile: anti-aircraft batteries must ring the coast of the south and east."
 radar_focus:0 "Radio Direction Finding"
 radar_focus_desc:0 "Watson-Watt's experiments at Orford Ness have shown that aircraft can be detected by radio long before they are seen or heard. Bawdsey Manor must turn the experiment into a working system."
 crypto_bomb_focus:0 "The Bombe"
 crypto_bomb_focus_desc:0 "The Polish cipher bureau has handed us its work on the German Enigma machine. At Bletchley Park, Turing and Welchman believe a machine can break the daily keys in hours rather than weeks."
 tizard_mission_focus_desc:0 "Sir Henry Tizard will carry the cavity magnetron and a dozen other secrets across the Atlantic. Whatever the Americans make of them, the work sharpens our own programmes."
 maud_focus_desc:0 "Peierls and Frisch have shown that a uranium bomb needs pounds of material, not tons. The MAUD Committee wants the work begun here, at once, whatever the Americans decide."

 # Focuses (new)
 ENG_the_stop_lines:0 "The Stop Lines"
 ENG_the_stop_lines_desc:0 "General Ironside proposes beach defences backed by lines of pillboxes and anti-tank ditches, the GHQ Line chief among them. An invader who breaks through the coast must be held at every river and canal on the road to London."
 ENG_the_home_guard:0 "The Home Guard"
 ENG_the_home_guard_desc:0 "A quarter of a million men gave their names within days of the appeal for Local Defence Volunteers. Armed and trained as the Home Guard, they free the regular army to strike back at any landing."
 ENG_auxiliary_units:0 "The Auxiliary Units"
 ENG_auxiliary_units_desc:0 "In hidden bases beneath the woods and farms of the coastal counties, small patrols are trained to stay behind if the enemy comes and to give him no rest."
 ENG_the_double_cross_system:0 "The Double-Cross System"
 ENG_the_double_cross_system_desc:0 "MI5 believes it has caught every agent the Abwehr has sent to these islands. Those who agree to work for us will go on reporting to their masters exactly what we wish the enemy to believe."
 ENG_britain_can_take_it:0 "Britain Can Take It"
 ENG_britain_can_take_it_desc:0 "The bombs fall and the people go to work the next morning. Wardens, firemen and the volunteers of home defence are no longer an afterthought to the war: they are the front line, and the whole world is watching them hold."

 # Spirits (one sentence each)
 ENG_home_ghq_line_1:0 "The GHQ Line"
 ENG_home_ghq_line_1_desc:0 "Pillboxes, anti-tank ditches and road blocks run across the south of England."
 ENG_home_ghq_line_2:0 "The GHQ Line"
 ENG_home_ghq_line_2_desc:0 "Behind the stop lines, the Auxiliary Units wait in their hidden bases to strike at an occupier."
 ENG_home_ghq_line_3:0 "The GHQ Line"
 ENG_home_ghq_line_3_desc:0 "The island is a fortress, and its people are its garrison."
 ENG_home_home_guard_1:0 "The Home Guard"
 ENG_home_home_guard_1_desc:0 "Volunteers guard the factories, the coast and the roads, so that the field army can counter-attack."
 ENG_home_home_guard_2:0 "The Home Guard"
 ENG_home_home_guard_2_desc:0 "The Home Guard is backed by the Auxiliary Units, trained to fight on in any part of the country the enemy takes."
 ENG_home_home_guard_3:0 "The Home Guard"
 ENG_home_home_guard_3_desc:0 "A million and a half men stand ready to defend their own towns and villages."
 ENG_home_twenty_committee:0 "The Twenty Committee"
 ENG_home_twenty_committee_desc:0 "Turned agents feed the enemy a careful diet of truth and fiction."

 # Tooltips (only what the game cannot show by itself)
 ENG_home_air_defense_max_tt:0 "§YStatic Anti-Air§! to the maximum in §Y[123.GetName]§!, §Y[125.GetName]§! and §Y[127.GetName]§! (those we control)."
 ENG_home_tizard_usa_tt:0 "§Y[USA.GetNameDefCap]§! receives as a gift:"
 ENG_home_usa_is_friendly_tt:0 "§Y[USA.GetNameDefCap]§! exists, is not at war with us and is not allied to anyone at war with us"

 # Events
 tfr_eng_home.1.t:0 "The Tizard Mission"
 tfr_eng_home.1.d:0 "A British delegation led by Sir Henry Tizard has brought us the cavity magnetron, jet propulsion, the proximity fuze and a dozen other secrets that Britain cannot exploit alone. They ask nothing in return beyond our goodwill and our factories' attention."
 tfr_eng_home.1.a:0 "Put our best people on it."
