l_english:
 TFR_SCW_OPEN:0 "Spain Vols"
 TFR_SCW_OPEN_TT:0 "Allocate Spanish Civil War volunteers. Active until the war ends or 1 January 1939."
 TFR_SCW_AXIS_TITLE:0 "AXIS - SPAIN VOLUNTEERS"
 TFR_SCW_ALLIES_TITLE:0 "ALLIES - SPAIN VOLUNTEERS"
 TFR_SCW_SOVIET_TITLE:0 "USSR - FIRST RESERVATION"
 TFR_SCW_DRAFT_AXIS:0 "Draft: [?GER.TFR_scw_draft_total_land|0]/16 divisions    [?GER.TFR_scw_draft_total_air|0]/600 aircraft"
 TFR_SCW_DRAFT_ALLIES:0 "Draft + USSR: [?ENG.TFR_scw_draft_total_land|0]/12 divisions    [?ENG.TFR_scw_draft_total_air|0]/300 aircraft"
 TFR_SCW_DRAFT_SOVIET:0 "Reservation: [?SOV.TFR_scw_draft_total_land|0]/6 divisions    [?SOV.TFR_scw_draft_total_air|0]/300 aircraft"
 TFR_SCW_LIVE:0 "Active: [?TFR_scw_live_total_land|0] divisions    [?TFR_scw_live_total_air|0] aircraft"
 TFR_SCW_HELP:0 "Set quotas with the sliders, then confirm. Send the actual divisions and air wings from the normal volunteer menus.\nAbove quota or bloc pool: 7 days to withdraw the excess, then the whole contingent is recalled."
 TFR_SCW_ALLIED_HELP:0 "Soviet reservation: [?SOV.TFR_scw_land|0] divisions / [?SOV.TFR_scw_air|0] aircraft, included in the Allied pool."
 TFR_SCW_HEADERS:0 "COUNTRY                         DIVISIONS                         AIRCRAFT"
 TFR_SCW_APPLY:0 "Confirm quotas"
 TFR_SCW_CLOSE:0 "Close"
 TFR_SCW_APPLY_TT:0 "Confirm this month's quotas. Withdraw excess volunteers before reducing a quota. Before 1 August 1936, UK must wait for the Soviet reservation."
 TFR_SCW_LOCKED:0 "Confirmed for this month"
 TFR_SCW_PERMISSION_TT:0 "Requires a confirmed quota with room left (own quota and bloc pool). Axis may send only to Nationalist Spain; Allies and USSR only to Republican Spain."
 TFR_scw_volunteer_limits:0 "Spanish Volunteer Quota"
 TFR_scw_volunteer_authority:0 "Approved Spanish Volunteers"
 TFR_scw_volunteer_authority_desc:0 "Your country has a confirmed volunteer quota. Germany allocates the Axis pool; the United Kingdom allocates the Allied pool after the Soviet reservation."
 TFR_SCW_COUNTRY:0 "COUNTRY"
 TFR_SCW_DIVISIONS:0 "Divisions"
 TFR_SCW_AIRCRAFT:0 "Aircraft"
 TFR_SCW_MONTHLY_HELP:0 "Quotas can be revised each calendar month. Above quota: 7 days to withdraw, then the whole contingent is recalled."
 TFR_SCW_INFO_TITLE:0 "SPANISH VOLUNTEERS"
 TFR_SCW_INFO_OVER:0 "The Spanish Civil War is over. Volunteer quotas are no longer managed."
 TFR_SCW_INFO_NONE:0 "Your country takes no part in the Spanish volunteer quotas. Germany allocates the Axis pool, the United Kingdom the Allied pool and the USSR its own reservation."
 TFR_SCW_TAB_AXIS:0 "Axis"
 TFR_SCW_TAB_ALLIES:0 "Allies"
 TFR_SCW_TAB_SOVIET:0 "My reservation"
 TFR_SCW_READ_ONLY:0 "View only. Germany controls Axis quotas; UK controls Allied quotas; USSR chooses its own reservation."
 TFR_SCW_SOV_READ_ONLY:0 "Soviet reservation - view only"
 TFR_SCW_SOV_PENDING:0 "§RSoviet has not picked.§! UK must wait until USSR confirms or 1 August 1936."
 TFR_SCW_SOV_PENDING_AUGUST:0 "§YSoviet has not picked.§! August deadline passed: UK may allocate the full remaining pool."
 tfr_scw_volunteers.2.t:0 "Volunteers above the Spanish quota"
 tfr_scw_volunteers.2.d:0 "Our volunteers in Spain exceed our confirmed quota or our share of the bloc pool.\nDivisions: [?ROOT.TFR_scw_sent_land|0] sent, [?ROOT.TFR_scw_ok_land|0] allowed. Aircraft based in Spain: about [?ROOT.TFR_scw_sent_air|0], [?ROOT.TFR_scw_ok_air|0] allowed (quota [?ROOT.TFR_scw_air|0]).\nWithdraw the excess within 7 days, otherwise the whole contingent will be recalled."
 tfr_scw_volunteers.2.a:0 "We will withdraw the excess."
 tfr_scw_volunteers.3.t:0 "Spanish volunteers recalled"
 tfr_scw_volunteers.3.d:0 "Our volunteers stayed above the quota for 7 days. The whole contingent has been recalled from Spain."
 tfr_scw_volunteers.3.a:0 "Understood."
 tfr_scw_volunteers.4.t:0 "Volunteers sent back"
 tfr_scw_volunteers.4.d:0 "We have no confirmed Spanish volunteer quota, or we sent volunteers to the wrong side. They have been recalled."
 tfr_scw_volunteers.4.a:0 "Understood."
