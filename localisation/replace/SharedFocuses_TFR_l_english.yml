 adaptive_eco_tt:0 "Adaptive Economy allows you to choose between §BLow§!, §OMedium§! and §RHigh§! value focuses. \n\n§GLow Value§! focuses give small bonuses but lead to the best §YPhase III focus§!. \n\n§OMedium Value§! focuses give moderate bonuses and lead to a decent §YPhase III focus§!. \n\n§RHigh Value§! focuses give large bonuses but lead to the worst §YPhase III focus§!. \n\n Focuses can be §Gmixed§! and will lead to a different §YPhase III focus§!" 

 AXIS_adaptive_economy:0 "Adaptive Economy"
 AXIS_adaptive_economy_desc:0 "Our economy must remain flexible, able to adapt to the demands of war and peace alike."

 AXIS_adaptive_2:0 "Streamline Production"
 AXIS_adaptive_2_desc:0 "Reorganize shifts and standardize parts to lift immediate military and naval throughput."

 AXIS_adaptive_1:0 "Synthetic Push"
 AXIS_adaptive_1_desc:0 "Expand synthetic facilities and chemistry to secure rubber and speed research."

 AXIS_adaptive_3:0 "Civilian Boost"
 AXIS_adaptive_3_desc:0 "Leverage civilian contractors and dispersed workshops to add off-map capacity."

 AXIS_war_economy:0 "War Economy"
 AXIS_war_economy_desc:0 "Issue bonds, centralize schedules, raise starting efficiency and cut conversion costs."

 AXIS_adaptive_1_phase2:0 "Intensify Output"
 AXIS_adaptive_1_phase2_desc:0 "Drive arms lines harder, improve learning curves, and push steady gains in throughput."

 AXIS_adaptive_2_phase2:0 "Customs Union"
 AXIS_adaptive_2_phase2_desc:0 "Build faster while easing consumer demand; expand extraction and stockpiles."

 AXIS_adaptive_3_phase2:0 "Late-War Construction"
 AXIS_adaptive_3_phase2_desc:0 "Broaden public contributions and streamline approvals for major construction."

 AXIS_adaptive_phase3:0 "Adaptive Phase III"
 AXIS_adaptive_phase3_desc:0 "Lock in the chosen path; final adjustments prepare the economy for late-war demands."

 AXIS_adaptive_phase3_high_high:0 "Process Mastery"
 AXIS_adaptive_phase3_high_high_desc:0 "Tighter tolerances and predictive maintenance raise factory efficiency caps."

 AXIS_adaptive_phase3_med_high:0 "Integrated Industry"
 AXIS_adaptive_phase3_med_high_desc:0 "Networked plants and shared standards add cap and modest day-to-day output."

 AXIS_adaptive_phase3_med_med:0 "Industrial Rationalization"
 AXIS_adaptive_phase3_med_med_desc:0 "Unified methods across docks and shop floors boost both cap and throughput."

 AXIS_adaptive_phase3_low_med:0 "Mass Production"
 AXIS_adaptive_phase3_low_med_desc:0 "Favor volume: broad upgrades lift output and push efficiency upward."

 AXIS_adaptive_phase3_low_low:0 "Industrial Surge"
 AXIS_adaptive_phase3_low_low_desc:0 "A sweeping mobilization delivers major gains in output and efficiency limits."

