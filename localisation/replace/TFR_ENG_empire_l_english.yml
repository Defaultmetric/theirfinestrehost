 ENG_the_sterling_area_idea:0 "The Sterling Area"
 ENG_the_sterling_area_idea_desc:0 "The currencies of the Commonwealth are pegged to the pound and their reserves held in London."
 ENG_the_colonies_will_fight_idea:0 "The Colonies Will Fight"
 ENG_the_colonies_will_fight_idea_desc:0 "Recruiting offices across the colonies send a steady stream of volunteers to the British Army."
 ENG_imperial_obligations_dm:0 "Imperial Obligations"
 ENG_imperial_obligations_dm_desc:0 "The machine tools, engineers and credit sent to our partners are missing at home (active investment steps: §Y[?ENG_total_investment|0]§!)."
 ENG_british_investment_dm:0 "British Investment"
 ENG_british_investment_dm_desc:0 "British capital and engineers are building up our industry while we stay in the British faction (steps: §Y[?ENG_investment_level|0]§!)."
 ENG_imperial_requisitions_dm:0 "Imperial Requisitions"
 ENG_imperial_requisitions_dm_desc:0 "London requisitions our output for the Home Islands until we are no longer a British subject in the British faction (requisitions: §Y[?ENG_requisition_level|0]§!)."
 tfr_eng_empire.1.t:0 "British Investment Arrives"
 tfr_eng_empire.1.d:0 "Factories financed and tooled from London have opened their gates. [ROOT.GetNameDefCap] has now received [?ROOT.ENG_investment_level|0] steps of British investment."
 tfr_eng_empire.1.a:0 "A welcome partnership."
 tfr_eng_empire.2.t:0 "Imperial Requisitions"
 tfr_eng_empire.2.d_imposed:0 "London has declared that the needs of the Home Islands come before all else, and our own development must wait. The spirit §RImperial Requisitions§! now weighs on our economy."
 tfr_eng_empire.2.d_level:0 "London has requisitioned more of our industry: the factories named in its order now work for Britain. Requisitions taken from us: [?ROOT.ENG_requisition_level|0]; everything is given back if we stop being a British subject in the British faction."
 tfr_eng_empire.2.a:0 "We have little choice."
 tfr_eng_empire.3.t:0 "British Investment Suspended"
 tfr_eng_empire.3.d:0 "Now that we have left the British faction, London has withdrawn every factory its investment gave us, and our §YBritish Investment§! spirit has lapsed."
 tfr_eng_empire.3.a:0 "So be it."
 tfr_eng_empire.3.tt:0 "Everything is rebuilt if we rejoin the British faction."
 tfr_eng_empire.4.t:0 "Foreign-Built Factories Withdrawn"
 tfr_eng_empire.4.d:0 "British investment had built up some of our new territory for another country, and those works have been dismantled: §R[?ROOT.ENG_clawed_civ_last|0]§! civilian factories, §R[?ROOT.ENG_clawed_mil_last|0]§! military factories and §R[?ROOT.ENG_clawed_dock_last|0]§! dockyards."
 tfr_eng_empire.4.a:0 "A pity."
 tfr_eng_empire.5.t:0 "Requisitions Released"
 tfr_eng_empire.5.d:0 "Countries we requisitioned from are no longer our subjects in the faction, and we have given back what we took: §R[?ROOT.ENG_req_released_mil_last|0]§! military and §R[?ROOT.ENG_req_released_civ_last|0]§! civilian offsite factories."
 tfr_eng_empire.5.a:0 "The Empire is not what it was."
